name: Sync Play Compliance With Main

on:
  push:
    branches:
      - feature/play-console-compliance
    paths:
      - '.github/workflows/sync-play-main.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/play-console-compliance
          fetch-depth: 0
      - run: |
          git config user.name Terrion
          git config user.email 63014185+terri0n@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feature/play-console-compliance
