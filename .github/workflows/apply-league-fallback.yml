name: Apply league fallback

on:
  push:
    branches:
      - fix/update-json-only

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-json-only

      - name: Reject missing league id
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java')
          text = path.read_text(encoding='utf-8')
          old = '\t\tInteger leagueId = integer(detail,\n\t\t\t\t"league.id", "leagueID", "info.league.id", "info.leagueID", "match.league.id");\n\t\tStringBuilder xml = new StringBuilder("<match><info><leagueID>")\n\t\t\t\t.append(leagueId == null ? 0 : leagueId)\n\t\t\t\t.append("</leagueID></info><playerStatsList>");'
          new = '\t\tInteger leagueId = integer(detail,\n\t\t\t\t"league.id", "leagueID", "info.league.id", "info.leagueID", "match.league.id");\n\t\tif (leagueId == null) {\n\t\t\treturn null;\n\t\t}\n\t\tStringBuilder xml = new StringBuilder("<match><info><leagueID>")\n\t\t\t\t.append(leagueId)\n\t\t\t\t.append("</leagueID></info><playerStatsList>");'
          count = text.count(old)
          if count != 1:
              raise SystemExit('Unexpected league target count: %d' % count)
          path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terrion'
          git config user.email '63014185+terri0n@users.noreply.github.com'
          git add sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java
          git diff --cached --check
          git commit -m 'Fallback when JSON match league is missing'
          git push origin HEAD:fix/update-json-only
