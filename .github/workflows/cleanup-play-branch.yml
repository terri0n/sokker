name: Cleanup Play Branch

on:
  push:
    branches:
      - feature/play-console-compliance
    paths:
      - '.github/workflows/cleanup-play-branch.yml'
      - '.github/scripts/cleanup_play_branch.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/play-console-compliance
          fetch-depth: 0
      - run: python3 .github/scripts/cleanup_play_branch.py
      - run: |
          git config user.name Terrion
          git config user.email 63014185+terri0n@users.noreply.github.com
          git add -A
          git commit -m 'chore: clean play compliance branch'
          git push origin HEAD:feature/play-console-compliance
