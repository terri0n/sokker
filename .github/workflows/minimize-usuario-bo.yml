name: Minimize UsuarioBO Compliance Diff

on:
  push:
    branches:
      - feature/play-console-compliance
    paths:
      - '.github/workflows/minimize-usuario-bo.yml'
      - '.github/scripts/minimize_usuario_bo.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/play-console-compliance
          fetch-depth: 0
      - run: python3 .github/scripts/minimize_usuario_bo.py
      - run: |
          git diff --check
          grep -q 'ACCOUNT_DELETION_REQUESTED_AT' sokker/src/com/formulamanager/sokker/bo/UsuarioBO.java
          grep -q 'purgar_secreto_actualizacion_automatica' sokker/src/com/formulamanager/sokker/bo/UsuarioBO.java
      - run: |
          git config user.name Terrion
          git config user.email 63014185+terri0n@users.noreply.github.com
          git add sokker/src/com/formulamanager/sokker/bo/UsuarioBO.java
          git commit -m 'refactor: minimize UsuarioBO compliance changes'
          git push origin HEAD:feature/play-console-compliance
