name: Apply no-residue training age repair cleanup

on:
  push:
    branches:
      - fix/one-off-repair-training-ages
    paths:
      - .github/workflows/apply-no-residue-training-age-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/one-off-repair-training-ages
          fetch-depth: 0

      - name: Remove persistent repair artifacts
        shell: python
        run: |
          from pathlib import Path

          p = Path('sokker/WebContent/jsp/asistente/repararEdadesUltimosEntrenamientos.jsp')
          s = p.read_text(encoding='utf-8')

          def rep(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, got {count}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          rep('''    private static final String MARKER_FILE_REPAIR = ".repair_training_ages_20260922.done";\n    private static final String BACKUP_DIR_REPAIR = "repair_training_ages_20260922_backup";\n\n''', '')

          rep('''        Path backupDirectory = directory.toPath().resolve(BACKUP_DIR_REPAIR);\n        RepairSummary summary = new RepairSummary();\n        for (File file : files) {\n            FileRepairResult result = repairFile(file.toPath(), backupDirectory);\n''', '''        RepairSummary summary = new RepairSummary();\n        for (File file : files) {\n            FileRepairResult result = repairFile(file.toPath());\n''')

          rep('''    private FileRepairResult repairFile(Path path, Path backupDirectory) throws IOException {\n''', '''    private FileRepairResult repairFile(Path path) throws IOException {\n''')

          rep('''        Files.createDirectories(backupDirectory);\n        Path backup = backupDirectory.resolve(path.getFileName().toString());\n        if (!Files.exists(backup)) {\n            Files.copy(path, backup, StandardCopyOption.COPY_ATTRIBUTES);\n        }\n\n''', '')

          start = s.index('    private void markDone(Path directory, RepairSummary summary) throws IOException {')
          end = s.index('    private String join(String[] tokens) {', start)
          s = s[:start] + s[end:]

          old_request = '''    File dataDirectory = new File(SystemUtil.getVar(SystemUtil.PATH));\n    Path marker = dataDirectory.toPath().resolve(MARKER_FILE_REPAIR);\n    boolean alreadyExecuted = Files.exists(marker);\n    String result = null;\n    String error = null;\n    String csrf = (String) session.getAttribute("repairTrainingAgesCsrf");\n\n    try {\n        selfTestRepair();\n    } catch (Throwable e) {\n        error = "El autotest de la reparación ha fallado: " + e.getClass().getName() + ": " + e.getMessage();\n    }\n\n    if (error == null && "POST".equalsIgnoreCase(request.getMethod())) {\n        String supplied = request.getParameter("csrf");\n        if (csrf == null || supplied == null || !csrf.equals(supplied)) {\n            response.sendError(HttpServletResponse.SC_FORBIDDEN);\n            return;\n        }\n        session.removeAttribute("repairTrainingAgesCsrf");\n\n        try {\n            if (Files.exists(marker)) {\n                result = "La reparación ya se ejecutó anteriormente. No se ha modificado nada.";\n            } else {\n                RepairSummary summary = repairDirectory(dataDirectory);\n                if (summary.concurrentSkips == 0) {\n                    markDone(dataDirectory.toPath(), summary);\n                    result = "Reparación terminada. Ficheros modificados: " + summary.modifiedFiles\n                            + ", jugadores corregidos: " + summary.modifiedPlayers\n                            + ", edades de entrenamientos corregidas: " + summary.modifiedSnapshots + ".";\n                } else {\n                    result = "Se corrigieron " + summary.modifiedSnapshots + " edades, pero "\n                            + summary.concurrentSkips + " fichero(s) cambiaron durante la reparación. "\n                            + "No se ha creado la marca de finalización; vuelve a ejecutar el JSP.";\n                }\n            }\n        } catch (Throwable e) {\n            error = e.getClass().getName() + ": " + e.getMessage();\n        }\n    } else if (error == null && !alreadyExecuted) {\n        csrf = UUID.randomUUID().toString();\n        session.setAttribute("repairTrainingAgesCsrf", csrf);\n    }\n'''

          new_request = '''    File dataDirectory = new File(SystemUtil.getVar(SystemUtil.PATH));\n    String result = null;\n    String error = null;\n    String csrf = (String) session.getAttribute("repairTrainingAgesCsrf");\n    boolean alreadyExecuted = Boolean.TRUE.equals(application.getAttribute("repairTrainingAges20260922Executed"));\n\n    try {\n        selfTestRepair();\n    } catch (Throwable e) {\n        error = "El autotest de la reparación ha fallado: " + e.getClass().getName() + ": " + e.getMessage();\n    }\n\n    if (error == null && "POST".equalsIgnoreCase(request.getMethod())) {\n        String supplied = request.getParameter("csrf");\n        if (csrf == null || supplied == null || !csrf.equals(supplied)) {\n            response.sendError(HttpServletResponse.SC_FORBIDDEN);\n            return;\n        }\n        session.removeAttribute("repairTrainingAgesCsrf");\n\n        try {\n            if (alreadyExecuted) {\n                result = "La reparación ya se ejecutó en este arranque del servidor. No se ha modificado nada.";\n            } else {\n                RepairSummary summary = repairDirectory(dataDirectory);\n                if (summary.concurrentSkips == 0) {\n                    application.setAttribute("repairTrainingAges20260922Executed", Boolean.TRUE);\n                    result = "Reparación terminada. Ficheros modificados: " + summary.modifiedFiles\n                            + ", jugadores corregidos: " + summary.modifiedPlayers\n                            + ", edades de entrenamientos corregidas: " + summary.modifiedSnapshots + ".";\n                } else {\n                    result = "Se corrigieron " + summary.modifiedSnapshots + " edades, pero "\n                            + summary.concurrentSkips + " fichero(s) cambiaron durante la reparación. "\n                            + "Vuelve a ejecutar el JSP para esos ficheros.";\n                }\n            }\n        } catch (Throwable e) {\n            error = e.getClass().getName() + ": " + e.getMessage();\n        }\n    } else if (error == null && !alreadyExecuted) {\n        csrf = UUID.randomUUID().toString();\n        session.setAttribute("repairTrainingAgesCsrf", csrf);\n    }\n'''
          rep(old_request, new_request)

          old_html = '''<% } else if (result != null) { %>\n    <h2><%= escapeHtmlRepair(result) %></h2>\n    <% if (Files.exists(marker)) { %>\n        <p>La reparación queda bloqueada por la marca <code><%= escapeHtmlRepair(MARKER_FILE_REPAIR) %></code>.</p>\n        <p>Ya puedes eliminar este JSP del despliegue.</p>\n    <% } %>\n<% } else if (alreadyExecuted) { %>\n    <h2>La reparación ya fue ejecutada.</h2>\n    <p>Este JSP no volverá a modificar ningún fichero.</p>\n    <p>Ya puedes eliminarlo del despliegue.</p>\n<% } else { %>\n    <h2>Reparar edades de los últimos entrenamientos</h2>\n    <p>Corrige únicamente jugadores de clubes cuyo snapshot actual pertenece a la temporada 1210-1222.</p>\n    <p>En la temporada anterior (1197-1209), cualquier entrenamiento que heredó por error la edad actual se cambia a edad actual - 1.</p>\n    <p>No toca selecciones, históricos archivados, otras temporadas ni campos distintos de la edad.</p>\n    <p>Antes de modificar cada fichero se guarda una copia en <code><%= escapeHtmlRepair(BACKUP_DIR_REPAIR) %></code>.</p>\n    <form method="post">\n        <input type="hidden" name="csrf" value="<%= escapeHtmlRepair(csrf) %>">\n        <button type="submit">Ejecutar reparación una sola vez</button>\n    </form>\n<% } %>\n'''

          new_html = '''<% } else if (result != null) { %>\n    <h2><%= escapeHtmlRepair(result) %></h2>\n    <p>Ya puedes eliminar este JSP del despliegue.</p>\n<% } else if (alreadyExecuted) { %>\n    <h2>La reparación ya fue ejecutada en este arranque del servidor.</h2>\n    <p>No se crean copias, marcas ni otros ficheros auxiliares.</p>\n    <p>Ya puedes eliminar este JSP del despliegue.</p>\n<% } else { %>\n    <h2>Reparar edades de los últimos entrenamientos</h2>\n    <p>Corrige únicamente jugadores de clubes cuyo snapshot actual pertenece a la temporada 1210-1222.</p>\n    <p>En la temporada anterior (1197-1209), cualquier entrenamiento que heredó por error la edad actual se cambia a edad actual - 1.</p>\n    <p>No toca selecciones, históricos archivados, otras temporadas ni campos distintos de la edad.</p>\n    <p>No crea copias de seguridad ni ficheros auxiliares.</p>\n    <form method="post">\n        <input type="hidden" name="csrf" value="<%= escapeHtmlRepair(csrf) %>">\n        <button type="submit">Ejecutar reparación</button>\n    </form>\n<% } %>\n'''
          rep(old_html, new_html)

          forbidden = ['MARKER_FILE_REPAIR', 'BACKUP_DIR_REPAIR', 'Files.createDirectories(backupDirectory)', 'Files.copy(path, backup']
          for token in forbidden:
              if token in s:
                  raise SystemExit('Persistent artifact code remains: ' + token)

          p.write_text(s, encoding='utf-8', newline='')

      - name: Verify no persistent artifacts
        shell: bash
        run: |
          set -euo pipefail
          f=sokker/WebContent/jsp/asistente/repararEdadesUltimosEntrenamientos.jsp
          ! grep -q 'repair_training_ages_20260922_backup' "$f"
          ! grep -q '\.repair_training_ages_20260922\.done' "$f"
          ! grep -q 'Files.copy(path, backup' "$f"
          grep -q 'application.setAttribute("repairTrainingAges20260922Executed", Boolean.TRUE)' "$f"
          git diff --check -- "$f"

      - name: Commit cleanup and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-no-residue-training-age-repair.yml
          git add sokker/WebContent/jsp/asistente/repararEdadesUltimosEntrenamientos.jsp
          git commit -m 'Avoid persistent files in one-off age repair'
          git push origin HEAD:fix/one-off-repair-training-ages
