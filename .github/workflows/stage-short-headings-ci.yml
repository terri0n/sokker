name: Stage short headings CI harness

on:
  push:
    branches:
      - fix/player-short-skill-headings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add harness to main compile workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/java8-compile.yml')
          s = p.read_text()
          compile_anchor = '            .github/harness/SokkerClientIdentificationHarness.java\n'
          run_anchor = '          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" SokkerClientIdentificationHarness\n'
          if 'PlayerShortSkillHeadingsHarness.java' not in s:
              if s.count(compile_anchor) != 1:
                  raise SystemExit('compile anchor not unique')
              s = s.replace(compile_anchor, compile_anchor.rstrip('\n') + ' \\\n            .github/harness/PlayerShortSkillHeadingsHarness.java\n', 1)
          if 'PlayerShortSkillHeadingsHarness\n' not in s:
              if s.count(run_anchor) != 1:
                  raise SystemExit('run anchor not unique')
              s = s.replace(run_anchor, run_anchor + '          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" PlayerShortSkillHeadingsHarness\n', 1)
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/java8-compile.yml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/java8-compile.yml
          git commit -m 'test: run short skill headings harness'
          git push origin HEAD:fix/player-short-skill-headings
