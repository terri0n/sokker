name: Java 8 compile

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build compile classpath
        shell: bash
        run: |
          set -euo pipefail
          mvn -q -f sokker/pom.xml dependency:build-classpath -Dmdep.outputFile=/tmp/maven-classpath.txt
          mvn -q dependency:get -Dartifact=javax.servlet:javax.servlet-api:4.0.1
          mvn -q dependency:get -Dartifact=javax.servlet.jsp:javax.servlet.jsp-api:2.3.3

      - name: Normalize mixed source encodings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('sokker/src')
          target = Path('/tmp/sokker-src')
          for path in source.rglob('*.java'):
              raw = path.read_bytes()
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  text = raw.decode('cp1252')
              out = target / path.relative_to(source)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Compile all Java sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sokker-classes
          SERVLET="$HOME/.m2/repository/javax/servlet/javax.servlet-api/4.0.1/javax.servlet-api-4.0.1.jar"
          JSP="$HOME/.m2/repository/javax/servlet/jsp/javax.servlet.jsp-api/2.3.3/javax.servlet.jsp-api-2.3.3.jar"
          MAVEN_CP="$(cat /tmp/maven-classpath.txt)"
          CP="sokker/WebContent/WEB-INF/lib/*:${MAVEN_CP}:${SERVLET}:${JSP}"
          find /tmp/sokker-src -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -encoding UTF-8 -cp "$CP" -d /tmp/sokker-classes

      - name: Verify compatibility harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/compat-harness
          SERVLET="$HOME/.m2/repository/javax/servlet/javax.servlet-api/4.0.1/javax.servlet-api-4.0.1.jar"
          JSP="$HOME/.m2/repository/javax/servlet/jsp/javax.servlet.jsp-api/2.3.3/javax.servlet.jsp-api-2.3.3.jar"
          MAVEN_CP="$(cat /tmp/maven-classpath.txt)"
          CP="sokker/WebContent/WEB-INF/lib/*:${MAVEN_CP}:${SERVLET}:${JSP}"
          javac -source 8 -target 8 -encoding UTF-8 -cp "/tmp/sokker-classes:${CP}" -d /tmp/compat-harness \
            .github/harness/PersistenceRoundTrip.java \
            .github/harness/AccountDeletionHarness.java \
            .github/harness/CredentialHygieneHarness.java \
            .github/harness/AccountDeletionUiHarness.java \
            .github/harness/AdminAccountDeletionHarness.java \
            .github/harness/PublicDeletionRequestHarness.java \
            .github/harness/PrivacyPagesHarness.java \
            .github/harness/TrainerMappingHarness.java \
            .github/harness/TrainingMatchMappingHarness.java \
            .github/harness/TrainingAgeBoundaryHarness.java \
            .github/harness/TrainingAgeSeasonRepairHarness.java \
            .github/harness/TeamIdThresholdHarness.java \
            .github/harness/CurrentApiHarness.java \
            .github/harness/UpdateAtomicityHarness.java \
            .github/harness/I18nParityHarness.java \
            .github/harness/CloudflareXmlSessionHarness.java \
            .github/harness/XmlCompatRegressionHarness.java \
            .github/harness/XmlPageAssociationHarness.java \
            .github/harness/NtBotIsolationHarness.java \
            .github/harness/NtSkillMergeHarness.java \
            .github/harness/SokkerClientIdentificationHarness.java \
            .github/harness/NtdbSendingDisabledHarness.java
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" PersistenceRoundTrip
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" com.formulamanager.sokker.bo.AccountDeletionHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" com.formulamanager.sokker.acciones.asistente.CredentialHygieneHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" AccountDeletionUiHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" com.formulamanager.sokker.acciones.asistente.AdminAccountDeletionHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" PublicDeletionRequestHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" PrivacyPagesHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" TrainerMappingHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" TrainingMatchMappingHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" TrainingAgeBoundaryHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" TrainingAgeSeasonRepairHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" TeamIdThresholdHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" CurrentApiHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" UpdateAtomicityHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" I18nParityHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" com.formulamanager.sokker.auxiliares.CloudflareXmlSessionHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" XmlCompatRegressionHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" XmlPageAssociationHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" NtBotIsolationHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" NtSkillMergeHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" SokkerClientIdentificationHarness
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" NtdbSendingDisabledHarness

      - name: Verify team ID classification uses shared threshold
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'public static int MAX_ID_SELECCION = 800;' sokker/src/com/formulamanager/sokker/bo/NtdbBO.java
          if grep -R -nE '(tid|def_tid|getDef_tid\(\))[[:space:]]*[<>][[:space:]]*1000' sokker/src sokker/WebContent; then
            echo 'Found hardcoded 1000 team-ID classification threshold' >&2
            exit 1
          fi

      - name: Assemble and verify WAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sokker-war
          mkdir -p /tmp/sokker-war/WEB-INF/classes
          cp -a sokker/WebContent/. /tmp/sokker-war/
          cp -a /tmp/sokker-classes/. /tmp/sokker-war/WEB-INF/classes/
          test -f /tmp/sokker-war/WEB-INF/web.xml
          test -f /tmp/sokker-war/WEB-INF/classes/com/formulamanager/sokker/bo/AsistenteBO.class
          test -d /tmp/sokker-war/WEB-INF/lib
          test "$(find /tmp/sokker-war/WEB-INF/lib -type f -name '*.jar' | wc -l)" -gt 0
          jar cf /tmp/sokker.war -C /tmp/sokker-war .
          jar tf /tmp/sokker.war > /tmp/sokker-war-entries.txt
          grep -Fxq 'WEB-INF/web.xml' /tmp/sokker-war-entries.txt
          grep -Fxq 'WEB-INF/classes/com/formulamanager/sokker/bo/AsistenteBO.class' /tmp/sokker-war-entries.txt
          test -s /tmp/sokker.war
