name: Java 8 compile

on:
  push:
    branches:
      - fix/update-json-only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-json-only

      - name: Apply pending player-properties compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java')
          raw = path.read_bytes()
          try:
              text = raw.decode('utf-8')
              encoding = 'utf-8'
          except UnicodeDecodeError:
              text = raw.decode('cp1252')
              encoding = 'cp1252'

          if 'import com.formulamanager.sokker.auxiliares.PlayerPropertiesCompat;' in text:
              raise SystemExit(0)

          nl = '\r\n' if '\r\n' in text else '\n'

          import_old = 'import com.formulamanager.sokker.auxiliares.Navegador;' + nl
          import_new = import_old + 'import com.formulamanager.sokker.auxiliares.PlayerPropertiesCompat;' + nl
          if text.count(import_old) != 1:
              raise SystemExit('Unexpected Navegador import count')
          text = text.replace(import_old, import_new, 1)

          loop_old = nl.join([
              '\t\t\tfor (String key : keys) {',
              '\t\t\t\tString linea = prop.getProperty(key);'
          ])
          loop_new = nl.join([
              '\t\t\tfor (String key : keys) {',
              '\t\t\t\tif (!PlayerPropertiesCompat.isManagedPlayerKey(key)) {',
              '\t\t\t\t\tcontinue;',
              '\t\t\t\t}',
              '\t\t\t\tString linea = prop.getProperty(key);'
          ])
          count = text.count(loop_old)
          if count != 2:
              raise SystemExit('Expected 2 player/juvenile read loops, found %d' % count)
          text = text.replace(loop_old, loop_new)

          player_save_old = nl.join([
              '\t\tString ruta = SystemUtil.getVar(SystemUtil.PATH) + tid + (historico ? "_historico" : "") + ".properties";',
              '\t\tUtil.guardar_properties(prop, ruta);'
          ])
          player_save_new = nl.join([
              '\t\tString ruta = SystemUtil.getVar(SystemUtil.PATH) + tid + (historico ? "_historico" : "") + ".properties";',
              '\t\tPlayerPropertiesCompat.preserveUnmanagedKeys(new File(ruta), prop);',
              '\t\tUtil.guardar_properties(prop, ruta);'
          ])
          if text.count(player_save_old) != 1:
              raise SystemExit('Unexpected player save block count')
          text = text.replace(player_save_old, player_save_new, 1)

          junior_save_old = nl.join([
              '\t\tString ruta = SystemUtil.getVar(SystemUtil.PATH) + tid + (historico ? "_historico" : "") + "_juveniles.properties";',
              '\t\tUtil.guardar_properties(prop, ruta);'
          ])
          junior_save_new = nl.join([
              '\t\tString ruta = SystemUtil.getVar(SystemUtil.PATH) + tid + (historico ? "_historico" : "") + "_juveniles.properties";',
              '\t\tPlayerPropertiesCompat.preserveUnmanagedKeys(new File(ruta), prop);',
              '\t\tUtil.guardar_properties(prop, ruta);'
          ])
          if text.count(junior_save_old) != 1:
              raise SystemExit('Unexpected juvenile save block count')
          text = text.replace(junior_save_old, junior_save_new, 1)

          path.write_bytes(text.encode(encoding))
          PY

          if ! git diff --quiet -- sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java; then
            git diff --check
            git config user.name "Terrion"
            git config user.email "63014185+terri0n@users.noreply.github.com"
            git add sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java
            git commit -m "Preserve unmanaged player database entries"
            git push origin HEAD:fix/update-json-only
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build compile classpath
        shell: bash
        run: |
          set -euo pipefail
          mvn -q -f sokker/pom.xml dependency:build-classpath -Dmdep.outputFile=/tmp/maven-classpath.txt
          mvn -q dependency:get -Dartifact=javax.servlet:javax.servlet-api:4.0.1
          mvn -q dependency:get -Dartifact=javax.servlet.jsp:javax.servlet.jsp-api:2.3.3

      - name: Normalize mixed source encodings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('sokker/src')
          target = Path('/tmp/sokker-src')
          for path in source.rglob('*.java'):
              raw = path.read_bytes()
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  text = raw.decode('cp1252')
              out = target / path.relative_to(source)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Compile all Java sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sokker-classes
          SERVLET="$HOME/.m2/repository/javax/servlet/javax.servlet-api/4.0.1/javax.servlet-api-4.0.1.jar"
          JSP="$HOME/.m2/repository/javax/servlet/jsp/javax.servlet.jsp-api/2.3.3/javax.servlet.jsp-api-2.3.3.jar"
          MAVEN_CP="$(cat /tmp/maven-classpath.txt)"
          CP="sokker/WebContent/WEB-INF/lib/*:${MAVEN_CP}:${SERVLET}:${JSP}"
          find /tmp/sokker-src -name '*.java' -print0 \
            | xargs -0 javac -source 8 -target 8 -encoding UTF-8 -cp "$CP" -d /tmp/sokker-classes

      - name: Verify compatibility harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/compat-harness
          SERVLET="$HOME/.m2/repository/javax/servlet/javax.servlet-api/4.0.1/javax.servlet-api-4.0.1.jar"
          JSP="$HOME/.m2/repository/javax/servlet/jsp/javax.servlet.jsp-api/2.3.3/javax.servlet.jsp-api-2.3.3.jar"
          MAVEN_CP="$(cat /tmp/maven-classpath.txt)"
          CP="sokker/WebContent/WEB-INF/lib/*:${MAVEN_CP}:${SERVLET}:${JSP}"
          javac -source 8 -target 8 -encoding UTF-8 \
            -cp "/tmp/sokker-classes:${CP}" \
            -d /tmp/compat-harness \
            .github/harness/PersistenceRoundTrip.java \
            .github/harness/TrainerMappingHarness.java
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" PersistenceRoundTrip
          java -cp "/tmp/compat-harness:/tmp/sokker-classes:${CP}" TrainerMappingHarness

      - name: Assemble and verify WAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sokker-war
          mkdir -p /tmp/sokker-war/WEB-INF/classes
          cp -a sokker/WebContent/. /tmp/sokker-war/
          cp -a /tmp/sokker-classes/. /tmp/sokker-war/WEB-INF/classes/

          test -f /tmp/sokker-war/WEB-INF/web.xml
          test -f /tmp/sokker-war/WEB-INF/classes/com/formulamanager/sokker/bo/AsistenteBO.class
          test -d /tmp/sokker-war/WEB-INF/lib
          test "$(find /tmp/sokker-war/WEB-INF/lib -type f -name '*.jar' | wc -l)" -gt 0

          jar cf /tmp/sokker.war -C /tmp/sokker-war .
          jar tf /tmp/sokker.war > /tmp/sokker-war-entries.txt
          grep -Fxq 'WEB-INF/web.xml' /tmp/sokker-war-entries.txt
          grep -Fxq 'WEB-INF/classes/com/formulamanager/sokker/bo/AsistenteBO.class' /tmp/sokker-war-entries.txt
          test -s /tmp/sokker.war
