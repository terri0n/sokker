name: Patch Play Task 4

on:
  push:
    branches:
      - feature/play-console-compliance
    paths:
      - '.github/workflows/patch-play-task4.yml'
      - '.github/scripts/patch_task4.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/play-console-compliance
      - run: python3 .github/scripts/patch_task4.py
      - run: |
          grep -q 'obtener_usuarios_con_borrado_solicitado' sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java
          grep -q 'solicitar_eliminacion_cuenta' sokker/WebContent/jsp/asistente/asistente.jsp
      - run: |
          git config user.name Terrion
          git config user.email 63014185+terri0n@users.noreply.github.com
          git add sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java sokker/WebContent/jsp/asistente/asistente.jsp
          git commit -m 'feat: prioritize account deletion requests for admins'
          git push origin HEAD:feature/play-console-compliance
