name: Verify one-off training age JSP v2

on:
  push:
    branches:
      - fix/one-off-repair-training-ages-v2

# Triggered after applying the birthday-week fix.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile JSP declarations and run self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          jsp = Path('sokker/WebContent/jsp/asistente/repararEdadesUltimosEntrenamientos.jsp')
          text = jsp.read_text(encoding='utf-8')
          imports = re.findall(r'<%@\s*page\s+import="([^"]+)"\s*%>', text)
          declarations = re.findall(r'<%!(.*?)%>', text, flags=re.S)
          if len(declarations) != 1:
              raise SystemExit('Se esperaba un único bloque de declaraciones JSP')
          java_imports = [i for i in imports if not i.startswith('com.formulamanager.')]
          source = ''.join('import %s;\n' % i for i in java_imports)
          source += 'public class RepairJspVerifierV2 {\n' + declarations[0]
          source += '\npublic static void main(String[] args) throws Exception { new RepairJspVerifierV2().selfTestRepair(); }\n}\n'
          Path('/tmp/RepairJspVerifierV2.java').write_text(source, encoding='utf-8')
          PY
          javac -source 8 -target 8 -encoding UTF-8 -d /tmp /tmp/RepairJspVerifierV2.java
          java -cp /tmp RepairJspVerifierV2
