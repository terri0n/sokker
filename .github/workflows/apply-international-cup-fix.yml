name: Apply international cup training fix

on:
  push:
    branches:
      - fix/international-cup-training-percentage

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java')
          data = path.read_bytes()
          old = b'\t\t\t\t\t\t\t\t\t|| tipo == 9) {\t\t// Champions Cup'
          nl = b'\r\n' if b'\r\n' in data else b'\n'
          new = (b'\t\t\t\t\t\t\t\t\t|| tipo == 9\t\t// Champions Cup' + nl
                 + b'\t\t\t\t\t\t\t\t\t|| tipo == 13) {\t\t// International Cup')
          if data.count(old) != 1:
              raise SystemExit('Expected exactly one Champions Cup training classification')
          path.write_bytes(data.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-international-cup-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java .github/workflows/apply-international-cup-fix.yml
          git diff --cached --check
          git commit -m 'Recognize international cups as official training'
          git push origin HEAD:fix/international-cup-training-percentage
