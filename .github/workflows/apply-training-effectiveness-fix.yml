name: Apply training effectiveness fix

on:
  push:
    branches:
      - fix/training-points-integer-display
    paths:
      - .github/workflows/apply-training-effectiveness-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/training-points-integer-display
      - name: Apply guarded source patch
        shell: python
        run: |
          from pathlib import Path

          jugador_path = Path("sokker/src/com/formulamanager/sokker/entity/Jugador.java")
          data = jugador_path.read_bytes()
          old_line = b"return getMinutos() == 0 ? 0f : getMinutos() < AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO ? (getMinutos() - 50) * 2 : AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO + (getMinutos() - AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO) * (186f - AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO) / (100f - AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO);"
          new_line = b"return getMinutos() == 0 ? 0f : getMinutos() <= AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO ? (getMinutos() - 50) * 2 : AsistenteBO.PORCENTAJE_OFICIALES + (getMinutos() - AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO) * (186f - AsistenteBO.PORCENTAJE_OFICIALES) / (100f - AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO);"
          if data.count(old_line) != 1:
              raise SystemExit("Jugador.java advanced conversion line not found exactly once")
          data = data.replace(old_line, new_line, 1)

          marker = b"\t// Devuelve el usuario correspondiente en la jornada indicada"
          eol = b"\r\n" if b"\r\n" in data else b"\n"
          helper = eol.join([
              b"",
              b"\tpublic static float getEfectividad_entrenamiento(float puntos_entrenamiento, boolean avanzado) {",
              b"\t\tfloat puntos = Math.min(186f, puntos_entrenamiento);",
              b"\t\tif (avanzado) {",
              b"\t\t\treturn puntos <= AsistenteBO.PORCENTAJE_OFICIALES ? 50f + puntos * 0.5f : AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO + (puntos - AsistenteBO.PORCENTAJE_OFICIALES) * (100f - AsistenteBO.PORCENTAJE_OFICIALES_AVANZADO) / (186f - AsistenteBO.PORCENTAJE_OFICIALES);",
              b"\t\t} else {",
              b"\t\t\treturn puntos <= AsistenteBO.PORCENTAJE_OFICIALES ? puntos : AsistenteBO.PORCENTAJE_OFICIALES + (puntos - AsistenteBO.PORCENTAJE_OFICIALES) * (100f - AsistenteBO.PORCENTAJE_OFICIALES) / (186f - AsistenteBO.PORCENTAJE_OFICIALES);",
              b"\t\t}",
              b"\t}",
              b"",
          ])
          if data.count(marker) != 1:
              raise SystemExit("Jugador.java insertion marker not found exactly once")
          data = data.replace(marker, helper + marker, 1)
          jugador_path.write_bytes(data)

          bo_path = Path("sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java")
          data = bo_path.read_bytes()
          start = data.find(b"\t\t\t\t\t\t\t\t// Vuelvo a calcular la efectividad")
          if start < 0:
              raise SystemExit("AsistenteBO.java inverse conversion start not found")
          end_marker = b"\t\t\t\t\t\t\t\t\t\r\nSERVLET_ASISTENTE._log_linea"
          end = data.find(end_marker, start)
          if end < 0:
              end_marker = b"\t\t\t\t\t\t\t\t\t\nSERVLET_ASISTENTE._log_linea"
              end = data.find(end_marker, start)
          if end < 0:
              raise SystemExit("AsistenteBO.java inverse conversion end not found")
          replacement = eol.join([
              b"\t\t\t\t\t\t\t\t// Vuelvo a calcular la efectividad con la conversion inversa y limitada al 100%",
              b"\t\t\t\t\t\t\t\tjug_semana.setMinutos(Jugador.getEfectividad_entrenamiento(puntos_entrenamiento, jug_semana.isEntrenamiento_avanzado()));",
              b"",
          ])
          data = data[:start] + replacement + data[end + len(end_marker) - len(b"SERVLET_ASISTENTE._log_linea"):]
          bo_path.write_bytes(data)
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sokker/src/com/formulamanager/sokker/entity/Jugador.java sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java
          git diff --cached --check
          git commit -m "fix: cap training effectiveness at 100"
          git push origin HEAD:fix/training-points-integer-display
