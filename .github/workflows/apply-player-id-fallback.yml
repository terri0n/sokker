name: Apply player id fallback

on:
  push:
    branches:
      - fix/update-json-only

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-json-only

      - name: Reject missing player id
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java')
          text = path.read_text(encoding='utf-8')
          old = '\t\t\tInteger id = integer(player, "id", "player.id");\n\t\t\tif (id == null) {\n\t\t\t\tcontinue;\n\t\t\t}'
          new = '\t\t\tInteger id = integer(player, "id", "player.id");\n\t\t\tif (id == null) {\n\t\t\t\treturn false;\n\t\t\t}'
          count = text.count(old)
          if count != 1:
              raise SystemExit('Unexpected player id target count: %d' % count)
          path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terrion'
          git config user.email '63014185+terri0n@users.noreply.github.com'
          git add sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java
          git diff --cached --check
          git commit -m 'Fallback when JSON match player id is missing'
          git push origin HEAD:fix/update-json-only
