name: Apply Slovak translation upload

on:
  push:
    branches:
      - fix/update-json-only
    paths:
      - .github/workflows/apply-sk-upload.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-json-only
          fetch-depth: 0

      - name: Build and validate Slovak bundle
        shell: bash
        run: |
          set -euo pipefail
          TARGET='sokker/src/com/formulamanager/sokker/idiomas/ApplicationResources_sk.properties'
          cat \
            .github/tmp-sk/part00.txt \
            .github/tmp-sk/part01.txt \
            .github/tmp-sk/part02.txt \
            .github/tmp-sk/part03.txt \
            .github/tmp-sk/part04.txt \
            .github/tmp-sk/part05.txt \
            .github/tmp-sk/part06.txt \
            > "$TARGET"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          en_path = Path('sokker/src/com/formulamanager/sokker/idiomas/ApplicationResources_en.properties')
          sk_path = Path('sokker/src/com/formulamanager/sokker/idiomas/ApplicationResources_sk.properties')

          def parse(path):
              keys = []
              values = {}
              for line in path.read_text(encoding='utf-8').splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith(('#', '!')) or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  key = key.strip()
                  keys.append(key)
                  values[key] = value.strip()
              return keys, values

          sk_bytes = sk_path.read_bytes()
          digest = hashlib.sha256(sk_bytes).hexdigest()
          expected_digest = 'f442e673c21af8a87cf69a6255fd2f6b0ddd6c64432b90d3122b159b472a30b2'
          assert digest == expected_digest, 'Staged Slovak content differs from the reviewed merged file: %s' % digest

          en_keys, _ = parse(en_path)
          sk_keys, sk_values = parse(sk_path)
          assert len(sk_keys) == len(set(sk_keys)), 'Duplicate Slovak resource keys found'
          assert len(sk_keys) == 292, 'Unexpected Slovak key count: %d' % len(sk_keys)
          assert set(sk_keys) == set(en_keys), 'Resource key mismatch. Missing=%s Extra=%s' % (
              sorted(set(en_keys) - set(sk_keys)), sorted(set(sk_keys) - set(en_keys)))

          expected = {
              'common.expected_level': 'Potenci\\u00E1l',
              'common.login': 'Nick v Sokker Asistent',
              'common.midfielders': 'Stredopoliari',
              'common.ready': 'Pripravi\\u0165',
              'ntdb.interface': 'Rozhranie NTDB',
              'ntdb.available_national_teams': 'Dostupn\\u00E9 n\\u00E1rodn\\u00E9 t\\u00EDmy',
              'ntdb.links': 'Odkazy',
              'ntdb.u21_schedule': 'Program U21',
              'ntdb.nt_schedule': 'Program NT',
          }
          for key, value in expected.items():
              assert sk_values.get(key) == value, '%s changed unexpectedly: %r' % (key, sk_values.get(key))

          print('Slovak bundle OK: %d keys, SHA-256 %s' % (len(sk_keys), digest))
          PY

      - name: Commit translated bundle and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Terrion"
          git config user.email "63014185+terri0n@users.noreply.github.com"
          git add sokker/src/com/formulamanager/sokker/idiomas/ApplicationResources_sk.properties
          git rm .github/tmp-sk/part*.txt .github/workflows/apply-sk-upload.yml
          git commit -m "Use uploaded Slovak translation"
          git push origin HEAD:fix/update-json-only
