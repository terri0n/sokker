name: Patch Play Task 3 Navegador

on:
  push:
    branches:
      - feature/play-console-compliance
    paths:
      - '.github/workflows/patch-play-task3-navegador.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/play-console-compliance
      - name: Remove password from LoginExceptionExt calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sokker/src/com/formulamanager/sokker/auxiliares/Navegador.java')
          text = p.read_text(encoding='utf-8')
          old1 = 'new LoginExceptionExt("Error when logging in to Sokker: bad password", login, password)'
          old2 = 'new LoginExceptionExt("Error when logging in to Sokker: user has no team", login, password)'
          if old1 not in text or old2 not in text:
              raise SystemExit('expected legacy LoginExceptionExt calls not found')
          text = text.replace(old1, 'new LoginExceptionExt("Error when logging in to Sokker: bad password", login)')
          text = text.replace(old2, 'new LoginExceptionExt("Error when logging in to Sokker: user has no team", login)')
          p.write_text(text, encoding='utf-8', newline='')
          PY
          ! grep -n 'LoginExceptionExt.*login, password' sokker/src/com/formulamanager/sokker/auxiliares/Navegador.java
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Terrion'
          git config user.email '63014185+terri0n@users.noreply.github.com'
          git add sokker/src/com/formulamanager/sokker/auxiliares/Navegador.java
          git commit -m 'fix: stop passing passwords to login exceptions'
          git push origin HEAD:feature/play-console-compliance
