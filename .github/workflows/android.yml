name: Android

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/android-*'
    paths:
      - 'android/SokkerAsistente/**'
      - 'sokker/WebContent/js/util.js'
      # Public web compliance pages are part of the Android WebView release contract.
      - 'sokker/WebContent/jsp/asistente/asistente.jsp'
      - 'sokker/WebContent/jsp/asistente/privacidad.jsp'
      - 'sokker/WebContent/jsp/asistente/eliminar_cuenta.jsp'
      - '.github/workflows/android.yml'
      - '.github/harness/AndroidSigningConfigHarness.py'
  pull_request:
    paths:
      - 'android/SokkerAsistente/**'
      - 'sokker/WebContent/js/util.js'
      - 'sokker/WebContent/jsp/asistente/asistente.jsp'
      - 'sokker/WebContent/jsp/asistente/privacidad.jsp'
      - 'sokker/WebContent/jsp/asistente/eliminar_cuenta.jsp'
      - '.github/workflows/android.yml'
      - '.github/harness/AndroidSigningConfigHarness.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify Gradle wrapper version
        working-directory: android/SokkerAsistente
        run: |
          test -x ./gradlew
          grep -q 'gradle-8.14.2-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Verify Android signing configuration contract
        run: python3 .github/harness/AndroidSigningConfigHarness.py

      - name: Unit tests and clean build
        working-directory: android/SokkerAsistente
        run: ./gradlew clean testDebugUnitTest assembleDebug bundleRelease --stacktrace

      - name: Verify build outputs and release version
        working-directory: android/SokkerAsistente
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          grep -Eq 'compileSdk(Version)?[[:space:]]+36' app/build.gradle
          grep -Eq 'targetSdk(Version)?[[:space:]]+36' app/build.gradle
          grep -Eq 'versionCode[[:space:]]+11' app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1\.11"' app/build.gradle
          grep -Eq 'namespace[[:space:]]+"com\.raqueto\.sokkerasistente"' app/build.gradle
          grep -Eq 'applicationId[[:space:]]+"com\.raqueto\.sokkerasistente"' app/build.gradle
          grep -q 'package="com.raqueto.sokkerasistente"' app/src/main/AndroidManifest.xml
          apkanalyzer manifest application-id app/build/outputs/apk/debug/app-debug.apk | grep -qx 'com.raqueto.sokkerasistente'
          if grep -R -n 'com\.formulamanager\.sokker\.asistente' app/src; then
            echo 'Legacy Android package is still present under app/src' >&2
            exit 1
          fi

      - name: Verify proxy integration contract
        run: |
          MAIN=android/SokkerAsistente/app/src/main/java/com/raqueto/sokkerasistente/MainActivity.java
          PROXY=android/SokkerAsistente/app/src/main/java/com/raqueto/sokkerasistente/SokkerProxy.java
          WEB_UTIL=sokker/WebContent/js/util.js
          grep -q 'SokkerProxy.isSokkerUrl' "$MAIN"
          grep -q 'SokkerProxy.buildForwardHeaders' "$MAIN"
          grep -q 'SokkerProxy.isLegacyXmlSessionLogin' "$MAIN"
          grep -q 'SokkerProxy.isCorsPreflight' "$MAIN"
          grep -q 'SokkerProxy.buildCorsPreflightResponseHeaders' "$MAIN"
          ! grep -R -nE 'Log\.[a-zA-Z]+\([^\n]*(ilogin|ipassword|buildLegacyLoginBody|body)' \
            android/SokkerAsistente/app/src/main/java
          ANDROID_KEY="$(sed -n 's/.*SOKKER_CLIENT_KEY = "\([^"]*\)".*/\1/p' "$PROXY")"
          WEB_KEY="$(sed -n 's/.*SOKKER_CLIENT_KEY = "\([^"]*\)".*/\1/p' "$WEB_UTIL")"
          test -n "$ANDROID_KEY"
          test -n "$WEB_KEY"
          test "$ANDROID_KEY" = "$WEB_KEY"

      - name: Verify privacy and deletion web contract
        run: |
          grep -q '/asistente/privacidad' sokker/WebContent/jsp/asistente/asistente.jsp
          grep -q '/asistente/eliminar_cuenta' sokker/WebContent/jsp/asistente/asistente.jsp
          ! grep -Eq 'googletagmanager|adsbygoogle|google_ad_client' sokker/WebContent/jsp/asistente/privacidad.jsp
          ! grep -Eq 'googletagmanager|adsbygoogle|google_ad_client' sokker/WebContent/jsp/asistente/eliminar_cuenta.jsp

      - name: Verify repository safety
        run: |
          if git ls-files 'android/SokkerAsistente/**' | grep -E '(^|/)(\.gradle|\.idea|build)/|local\.properties$|\.(apk|aab|jks|keystore)$|key\.properties$'; then
            echo 'Generated Android artifact or signing material is tracked' >&2
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|storePassword|keyPassword' -- 'android/SokkerAsistente/**'; then
            echo 'Private key or signing password material is tracked in Android project' >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SokkerAsistente-1.11-apk
          path: android/SokkerAsistente/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SokkerAsistente-1.11-aab
          path: android/SokkerAsistente/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
