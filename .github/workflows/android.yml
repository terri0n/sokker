name: Android

on:
  push:
    branches:
      - feature/android-play-release
    paths:
      - 'android/SokkerAsistente/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/SokkerAsistente/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'
      - name: Install Android 35 platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify recovered baseline
        working-directory: android/SokkerAsistente
        run: gradle testDebugUnitTest assembleDebug --stacktrace
