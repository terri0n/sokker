name: Apply incomplete match fallback

on:
  push:
    branches:
      - fix/update-json-only

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-json-only

      - name: Reject incomplete JSON match timing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '\t\tStringWebResponse response = new StringWebResponse(xml, new URL(url));\n\t\treturn new XmlPage(response, navegador.getCurrentWindow());',
                  '\t\tif (xml == null) {\n\t\t\treturn null;\n\t\t}\n\n\t\tStringWebResponse response = new StringWebResponse(xml, new URL(url));\n\t\treturn new XmlPage(response, navegador.getCurrentWindow());'
              ),
              (
                  '\t\tappendPlayers(xml, list(lineup, "homePlayers", "home.players", "lineup.homePlayers"), stats);\n\t\tappendPlayers(xml, list(lineup, "awayPlayers", "away.players", "lineup.awayPlayers"), stats);\n\t\treturn xml.append("</playerStatsList></match>").toString();',
                  '\t\tif (!appendPlayers(xml, list(lineup, "homePlayers", "home.players", "lineup.homePlayers"), stats)\n\t\t\t\t|| !appendPlayers(xml, list(lineup, "awayPlayers", "away.players", "lineup.awayPlayers"), stats)) {\n\t\t\treturn null;\n\t\t}\n\t\treturn xml.append("</playerStatsList></match>").toString();'
              ),
              (
                  '\tprivate static void appendPlayers(StringBuilder xml, List<?> players, Object stats) {',
                  '\tprivate static boolean appendPlayers(StringBuilder xml, List<?> players, Object stats) {'
              ),
              (
                  "\t\t\t\tif (minutes == null) {\n\t\t\t\t\t// Sin minutos no fabricamos 90' para titulares: una estimación falsa\n\t\t\t\t\t// contaminaría el cálculo provisional de entrenamiento de la semana.\n\t\t\t\t\tcontinue;\n\t\t\t\t}",
                  '\t\t\t\tif (minutes == null) {\n\t\t\t\t\t// Si no podemos reconstruir el tiempo jugado de un miembro de la alineación,\n\t\t\t\t\t// rechazamos todo el adaptador para que el llamador use el XML real.\n\t\t\t\t\treturn false;\n\t\t\t\t}'
              ),
              (
                  '\t\t\txml.append("<playerStats><playerID>").append(id).append("</playerID>")\n\t\t\t\t.append("<number>").append(number).append("</number>")\n\t\t\t\t.append("<timeIn>").append(timeIn).append("</timeIn>")\n\t\t\t\t.append("<timeOut>").append(timeOut).append("</timeOut>")\n\t\t\t\t.append("<formation>").append(formation).append("</formation></playerStats>");\n\t\t}\n\t}',
                  '\t\t\txml.append("<playerStats><playerID>").append(id).append("</playerID>")\n\t\t\t\t.append("<number>").append(number).append("</number>")\n\t\t\t\t.append("<timeIn>").append(timeIn).append("</timeIn>")\n\t\t\t\t.append("<timeOut>").append(timeOut).append("</timeOut>")\n\t\t\t\t.append("<formation>").append(formation).append("</formation></playerStats>");\n\t\t}\n\t\treturn true;\n\t}'
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit('Unexpected replacement target count: %d' % count)
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terrion'
          git config user.email '63014185+terri0n@users.noreply.github.com'
          git add sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java
          git diff --cached --check
          git commit -m 'Fallback when JSON match timing is incomplete'
          git push origin HEAD:fix/update-json-only
