name: Patch Play Task 7

on:
  push:
    branches:
      - feature/play-console-compliance
    paths:
      - '.github/workflows/patch-play-task7.yml'
      - '.github/scripts/patch_play_task7.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/play-console-compliance
      - run: python3 .github/scripts/patch_play_task7.py
      - run: |
          grep -q 'privacy.title' sokker/src/com/formulamanager/sokker/idiomas/ApplicationResources_en.properties
          grep -q '/asistente/privacidad' sokker/WebContent/jsp/asistente/asistente.jsp
      - run: |
          git config user.name Terrion
          git config user.email 63014185+terri0n@users.noreply.github.com
          git add sokker/src/com/formulamanager/sokker/idiomas/ApplicationResources_*.properties \
                  sokker/WebContent/jsp/asistente/asistente.jsp \
                  sokker/WebContent/jsp/asistente/eliminar_cuenta_admin.jsp
          git commit -m 'feat: add privacy and account deletion translations'
          git push origin HEAD:feature/play-console-compliance
