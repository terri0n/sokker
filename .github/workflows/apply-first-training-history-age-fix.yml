name: Apply first-training history age fix

on:
  push:
    branches:
      - fix/first-training-age-boundary
    paths:
      - .github/workflows/apply-first-training-history-age-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-training-age-boundary
          fetch-depth: 0

      - name: Patch historical player ages
        shell: python
        run: |
          from pathlib import Path

          path = Path('sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java')
          data = path.read_bytes()
          nl = b'\r\n' if b'\r\n' in data else b'\n'

          def replace_once(old, new):
              global data
              old_b = old.encode('utf-8').replace(b'\n', nl)
              new_b = new.encode('utf-8').replace(b'\n', nl)
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit('Expected one match, found %d for %r' % (count, old))
              data = data.replace(old_b, new_b, 1)

          replace_once(
              '\tpublic static Jugador combinar_jugadores(Jugador nuevo, Jugador historico) {',
              '\tpublic static int calcular_edad_historica(int edad_actual, int jornada_actual, int jornada_historica, int ajuste_edad) {\n'
              '\t\t// El jueves de la última jornada se usa +1 para representar la edad con la que entrenará\n'
              '\t\t// el jugador tras el cumpleaños. Desde el sábado hasta el miércoles, -1 marca la misma\n'
              '\t\t// frontera aunque la edad actual de Sokker ya haya cambiado. En ambos casos, el histórico\n'
              '\t\t// completado todavía pertenece a la edad anterior.\n'
              '\t\tint edad = edad_actual - (ajuste_edad == 0 ? 0 : 1);\n'
              '\n'
              '\t\t// Fuera de la semana especial, cada inicio de temporada que cruzamos hacia atrás\n'
              '\t\t// corresponde a un cumpleaños adicional.\n'
              '\t\tfor (int jornada = jornada_actual; jornada > jornada_historica; jornada--) {\n'
              '\t\t\tif (getJornadaMod(jornada) == 0) {\n'
              '\t\t\t\tedad--;\n'
              '\t\t\t}\n'
              '\t\t}\n'
              '\t\treturn edad;\n'
              '\t}\n'
              '\n'
              '\tpublic static void ajustar_edades_historicas(Jugador jugador, int ajuste_edad) {\n'
              '\t\tJugador historico = jugador.getOriginal();\n'
              '\t\twhile (historico != null) {\n'
              '\t\t\thistorico.setEdad(calcular_edad_historica(jugador.getEdad(), jugador.getJornada(), historico.getJornada(), ajuste_edad));\n'
              '\t\t\thistorico = historico.getOriginal();\n'
              '\t\t}\n'
              '\t}\n'
              '\n'
              '\tpublic static Jugador combinar_jugadores(Jugador nuevo, Jugador historico) {'
          )

          replace_once(
              '\t\t// Actualizamos jornada, país, nombre del equipo y tipo de entrenamiento\n'
              '\t\tint jornada_anterior = _usuario.getDef_jornada();',
              '\t\t// La API solo da la edad actual. Normalizamos las edades de la cadena histórica una vez\n'
              '\t\t// terminada de construir (incluidos informes Plus y repesca), sin tocar la edad viva.\n'
              '\t\tfor (Jugador j : jugadores_actualizados) {\n'
              '\t\t\tajustar_edades_historicas(j, ajuste_edad);\n'
              '\t\t}\n'
              '\n'
              '\t\t// Actualizamos jornada, país, nombre del equipo y tipo de entrenamiento\n'
              '\t\tint jornada_anterior = _usuario.getDef_jornada();'
          )

          path.write_bytes(data)

      - name: Verify targeted diff
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only | grep -v '^\.github/workflows/apply-first-training-history-age-fix.yml$' || true)
          test "$changed" = 'sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java'
          git -c core.whitespace=cr-at-eol diff --check -- sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java

      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-first-training-history-age-fix.yml
          git add sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java
          git commit -m 'Fix age of first training history around birthday'
          git push origin HEAD:fix/first-training-age-boundary
