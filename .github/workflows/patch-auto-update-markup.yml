name: Patch automatic update markup

on:
  push:
    branches:
      - fix/remove-auto-update-markup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-auto-update-markup

      - name: Remove retired automatic update markup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sokker/WebContent/jsp/asistente/asistente.jsp')
          data = path.read_bytes()

          lines = [
              b'\t\t\t\t\t\t\t<c:if test="${sessionScope.usuario.def_tid > MAX_ID_SELECCION}">',
              b'\t\t\t\t\t\t\t\t<label class="peque" for="actualizacion_automatica">',
              b'\t\t\t\t\t\t\t\t\t<input type="checkbox" name="actualizacion_automatica" id="actualizacion_automatica" ${empty sessionScope.usuario.actualizacion_automatica ? \'\' : \'checked\'} />',
              b'\t\t\t\t\t\t\t\t\t<fmt:message key="menu.automatic_update" />',
              b'\t\t\t\t\t\t\t\t</label>',
              b'\t\t\t\t\t\t\t\t<div class="material-icons rojo borde-blanco help vertical" title="<fmt:message key="config.info_automatic_update" />">help</div>',
              b'\t\t\t\t\t\t\t\t<br />',
              b'\t\t\t\t\t\t\t</c:if>',
          ]

          removed = False
          for newline in (b'\r\n', b'\n'):
              block = newline.join(lines) + newline
              if block in data:
                  data = data.replace(block, b'', 1)
                  removed = True
                  break

          if not removed:
              raise SystemExit('Automatic update markup block not found exactly')

          for forbidden in (b'actualizacion_automatica', b'menu.automatic_update', b'config.info_automatic_update'):
              if forbidden in data:
                  raise SystemExit('Retired automatic update UI reference still present: ' + forbidden.decode())

          path.write_bytes(data)
          Path('.github/workflows/patch-auto-update-markup.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sokker/WebContent/jsp/asistente/asistente.jsp .github/workflows/patch-auto-update-markup.yml
          git commit -m "Remove automatic update markup from assistant UI"
          git push origin HEAD:fix/remove-auto-update-markup
