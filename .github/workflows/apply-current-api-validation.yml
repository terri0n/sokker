name: Apply current API validation

on:
  push:
    branches:
      - fix/update-json-only

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-json-only

      - name: Validate current API fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sokker/src/com/formulamanager/sokker/auxiliares/Navegador.java')
          text = path.read_text(encoding='utf-8')
          old = '''\t@SuppressWarnings("unchecked")
\tpublic Integer obtener_jornada_json(WebClient navegador) throws FailingHttpStatusCodeException, MalformedURLException, IOException {
\t\tif (jornada != null) {
\t\t\treturn jornada;
\t\t}

\t\tLinkedHashMap<String, Object> actual = (LinkedHashMap<String, Object>) JSONUtil.getJson(navegador, AsistenteBO.SOKKER_URL + "/api/current");
\t\tInteger week = JSONUtil.getInteger(actual, "today.week");
\t\tInteger dia = JSONUtil.getInteger(actual, "today.day");
\t\tint jornada_actual = week - (dia >= 5 ? 0 : 1);
\t\tsetJornada(jornada_actual);

\t\tif (getJornadaMod(jornada_actual) == 12 && dia == 5) {
\t\t\tincrementar_edad = true;
\t\t}

\t\treturn jornada;
\t}'''
          new = '''\tpublic static Integer calcular_jornada_actual(LinkedHashMap<String, Object> actual) throws IOException {
\t\tif (actual == null) {
\t\t\tthrow new IOException("Incomplete /api/current payload: missing root object");
\t\t}
\t\tInteger week = JSONUtil.getInteger(actual, "today.week");
\t\tInteger dia = JSONUtil.getInteger(actual, "today.day");
\t\tif (week == null || dia == null) {
\t\t\tthrow new IOException("Incomplete /api/current payload: missing today.week or today.day");
\t\t}
\t\treturn week - (dia >= 5 ? 0 : 1);
\t}

\t@SuppressWarnings("unchecked")
\tpublic Integer obtener_jornada_json(WebClient navegador) throws FailingHttpStatusCodeException, MalformedURLException, IOException {
\t\tif (jornada != null) {
\t\t\treturn jornada;
\t\t}

\t\tLinkedHashMap<String, Object> actual = (LinkedHashMap<String, Object>) JSONUtil.getJson(navegador, AsistenteBO.SOKKER_URL + "/api/current");
\t\tint jornada_actual = calcular_jornada_actual(actual);
\t\tInteger dia = JSONUtil.getInteger(actual, "today.day");
\t\tsetJornada(jornada_actual);

\t\tif (getJornadaMod(jornada_actual) == 12 && dia == 5) {
\t\t\tincrementar_edad = true;
\t\t}

\t\treturn jornada;
\t}'''
          count = text.count(old)
          if count != 1:
              raise SystemExit('Unexpected current API target count: %d' % count)
          path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terrion'
          git config user.email '63014185+terri0n@users.noreply.github.com'
          git add sokker/src/com/formulamanager/sokker/auxiliares/Navegador.java
          git diff --cached --check
          git commit -m 'Validate current API week and day fields'
          git push origin HEAD:fix/update-json-only
