name: Apply update atomicity fixes

on:
  push:
    branches:
      - fix/update-json-only

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-json-only

      - name: Stop swallowing trainer and junior failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java')
          text = path.read_bytes().decode('utf-8')
          nl = '\r\n'

          trainer_start = text.index('\tpublic static void leer_entrenadores')
          trainer_end = text.index(nl + '\tpublic static ', trainer_start + 1)
          trainer = text[trainer_start:trainer_end]

          threshold_old = 'if (usuario.getDef_tid() > 1000) {'
          if trainer.count(threshold_old) != 1:
              raise SystemExit('Unexpected trainer threshold target count: %d' % trainer.count(threshold_old))
          trainer = trainer.replace(threshold_old, 'if (usuario.getDef_tid() > NtdbBO.MAX_ID_SELECCION) {')

          trainer_catch_old = '\t\t\t} catch (Exception e) {' + nl + '\t\t\t\te.printStackTrace();' + nl + '\t\t\t}'
          trainer_catch_new = '\t\t\t} catch (Exception e) {' + nl + '\t\t\t\tthrow new RuntimeException("Error al leer entrenadores", e);' + nl + '\t\t\t}'
          if trainer.count(trainer_catch_old) != 1:
              raise SystemExit('Unexpected trainer catch target count: %d' % trainer.count(trainer_catch_old))
          trainer = trainer.replace(trainer_catch_old, trainer_catch_new)
          text = text[:trainer_start] + trainer + text[trainer_end:]

          junior_start = text.index('\tprotected static List<Juvenil> obtener_juveniles')
          junior_end = text.index(nl + '\tpublic static ', junior_start + 1)
          junior = text[junior_start:junior_end]
          junior_catch_old = '\t\t} catch (Exception e) {' + nl + '\t\t\te.printStackTrace();' + nl + '\t\t}'
          junior_catch_new = '\t\t} catch (Exception e) {' + nl + '\t\t\tthrow new RuntimeException("Error al leer juveniles", e);' + nl + '\t\t}'
          if junior.count(junior_catch_old) != 1:
              raise SystemExit('Unexpected junior catch target count: %d' % junior.count(junior_catch_old))
          junior = junior.replace(junior_catch_old, junior_catch_new)
          text = text[:junior_start] + junior + text[junior_end:]

          path.write_bytes(text.encode('utf-8'))
          PY

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terrion'
          git config user.email '63014185+terri0n@users.noreply.github.com'
          git add sokker/src/com/formulamanager/sokker/bo/AsistenteBO.java
          git diff --cached --check
          git commit -m 'Abort updates when trainer or junior loading fails'
          git push origin HEAD:fix/update-json-only
