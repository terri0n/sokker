name: Apply training history null-snapshot fix

on:
  push:
    branches:
      - fix/training-history-null-snapshot

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/training-history-null-snapshot

      - name: Apply minimal Jugador fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sokker/src/com/formulamanager/sokker/entity/Jugador.java')
          raw = path.read_bytes()
          text = raw.decode('utf-8')
          old = '''\tpublic List<Entrenamiento> getEntrenamientosTemporada2(TIPO_ENTRENAMIENTO habilidad, Entrenamiento entrenamiento_act) {\r\n\t\tList<Entrenamiento> entrenamientos = new ArrayList<Entrenamiento>();\r\n\t\tfloat puntos_entrenamiento = lesion != null && lesion > 7 ? 0 : getMinutos_entrenamiento(habilidad);\r\n\r\n\t\t// Mstyslav Pidchenko tenía las habilidades antiguas a null y fallaba aquí\r\n\t\tInteger valor = getValor_habilidad(habilidad);\r\n\t\tif (valor != null) {\r\n\t\t\tif (entrenamiento_act.valor_habilidad == valor) {\r\n\t\t\t\tentrenamiento_act.jornadas.add(this);\r\n\t\t\t\tentrenamiento_act.puntos_entrenamiento.add(puntos_entrenamiento);\r\n\t\t\t} else {\r\n\t\t\t\tentrenamiento_act.abierto_izq = false;\r\n\t\t\t\tif (entrenamiento_act.jornadas.size() > 0) {\r\n\t\t\t\t\tentrenamientos.add(entrenamiento_act);\r\n\t\t\t\t}\r\n\t\t\t\t\r\n\t\t\t\tentrenamiento_act = new Entrenamiento(valor);\r\n\t\t\t\tentrenamiento_act.abierto_der = false;\r\n\t\t\t\tentrenamiento_act.jornadas.add(this);\r\n\t\t\t\tentrenamiento_act.puntos_entrenamiento.add(puntos_entrenamiento);\r\n\t\t\t}\r\n\t\t\t\r\n\t\t\tif (original != null) {\r\n\t\t\t\tentrenamientos.addAll(original.getEntrenamientosTemporada2(habilidad, entrenamiento_act));\r\n\t\t\t} else if (entrenamiento_act.jornadas.size() > 0) {\r\n\t\t\t\tentrenamientos.add(entrenamiento_act);\t\t\t\t\r\n\t\t\t}\r\n\t\t}\r\n\t\treturn entrenamientos;\r\n\t}\r\n'''
          new = '''\tpublic List<Entrenamiento> getEntrenamientosTemporada2(TIPO_ENTRENAMIENTO habilidad, Entrenamiento entrenamiento_act) {\r\n\t\tList<Entrenamiento> entrenamientos = new ArrayList<Entrenamiento>();\r\n\r\n\t\t// Mstyslav Pidchenko tenía las habilidades antiguas a null. Esos snapshots\r\n\t\t// no aportan un nivel, pero tampoco deben cortar el histórico anterior.\r\n\t\tInteger valor = getValor_habilidad(habilidad);\r\n\t\tif (valor != null) {\r\n\t\t\tfloat puntos_entrenamiento = lesion != null && lesion > 7 ? 0 : getMinutos_entrenamiento(habilidad);\r\n\t\t\tif (entrenamiento_act.valor_habilidad == valor) {\r\n\t\t\t\tentrenamiento_act.jornadas.add(this);\r\n\t\t\t\tentrenamiento_act.puntos_entrenamiento.add(puntos_entrenamiento);\r\n\t\t\t} else {\r\n\t\t\t\tentrenamiento_act.abierto_izq = false;\r\n\t\t\t\tif (entrenamiento_act.jornadas.size() > 0) {\r\n\t\t\t\t\tentrenamientos.add(entrenamiento_act);\r\n\t\t\t\t}\r\n\t\t\t\t\r\n\t\t\t\tentrenamiento_act = new Entrenamiento(valor);\r\n\t\t\t\tentrenamiento_act.abierto_der = false;\r\n\t\t\t\tentrenamiento_act.jornadas.add(this);\r\n\t\t\t\tentrenamiento_act.puntos_entrenamiento.add(puntos_entrenamiento);\r\n\t\t\t}\r\n\t\t}\r\n\r\n\t\tif (original != null) {\r\n\t\t\tentrenamientos.addAll(original.getEntrenamientosTemporada2(habilidad, entrenamiento_act));\r\n\t\t} else if (entrenamiento_act.jornadas.size() > 0) {\r\n\t\t\tentrenamientos.add(entrenamiento_act);\t\t\t\t\r\n\t\t}\r\n\t\treturn entrenamientos;\r\n\t}\r\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one getEntrenamientosTemporada2 block to patch')
          path.write_bytes(text.replace(old, new).encode('utf-8'))
          PY

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-training-history-null-snapshot.yml
          git add sokker/src/com/formulamanager/sokker/entity/Jugador.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve training history across null skill snapshots'
          git push origin HEAD:fix/training-history-null-snapshot
