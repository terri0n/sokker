name: Apply XML page association fix

on:
  push:
    branches:
      - fix/xml-page-association

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xml-page-association
          fetch-depth: 0

      - name: Apply source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java'): (
                  '\t\tStringWebResponse response = new StringWebResponse(xml, new URL(url));\n\t\treturn new XmlPage(response, navegador.getCurrentWindow());',
                  '\t\treturn SokkerXmlPageFactory.create(navegador, xml, url);'
              ),
              Path('sokker/src/com/formulamanager/sokker/auxiliares/SokkerPlayerXmlCompat.java'): (
                  '        StringWebResponse response = new StringWebResponse(xml, new URL(url));\n        return new XmlPage(response, navegador.getCurrentWindow());',
                  '        return SokkerXmlPageFactory.create(navegador, xml, url);'
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one old constructor, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='')

          Path('.github/workflows/apply-xml-page-association-fix.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java \
                  sokker/src/com/formulamanager/sokker/auxiliares/SokkerPlayerXmlCompat.java \
                  .github/workflows/apply-xml-page-association-fix.yml
          git commit -m 'Attach synthetic XML pages before XPath'
          git push origin HEAD:fix/xml-page-association
