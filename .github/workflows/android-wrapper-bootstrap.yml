name: Android wrapper bootstrap

on:
  push:
    branches:
      - tmp/android-wrapper-bootstrap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    if: "!contains(github.event.head_commit.message, 'generated Gradle wrapper')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Generate wrapper
        working-directory: android/SokkerAsistente
        run: gradle wrapper --gradle-version 8.14.2

      - name: Commit generated Gradle wrapper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/SokkerAsistente/gradlew \
                  android/SokkerAsistente/gradlew.bat \
                  android/SokkerAsistente/gradle/wrapper/gradle-wrapper.jar \
                  android/SokkerAsistente/gradle/wrapper/gradle-wrapper.properties
          git commit -m 'build: generated Gradle wrapper'
          git push origin HEAD:tmp/android-wrapper-bootstrap
