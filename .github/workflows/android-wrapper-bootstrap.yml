name: Android wrapper bootstrap

on:
  push:
    branches:
      - tmp/android-wrapper-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Generate wrapper
        working-directory: android/SokkerAsistente
        run: gradle wrapper --gradle-version 8.14.2

      - name: Upload wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-8.14.2
          path: |
            android/SokkerAsistente/gradlew
            android/SokkerAsistente/gradlew.bat
            android/SokkerAsistente/gradle/wrapper/gradle-wrapper.jar
            android/SokkerAsistente/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
