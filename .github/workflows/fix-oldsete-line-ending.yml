name: Fix old SETE line ending

on:
  push:
    branches:
      - fix/browser-sokker-util

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[oldsete-line-ending-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve old SETE CRLF around util include
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sokker/WebContent/jsp/sete/oldsete.jsp')
          data = path.read_bytes()
          old = b'<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.0/jquery.min.js"></script>\n\t<script type="text/javascript" src="${pageContext.request.contextPath}/js/util.js"></script>\r\n'
          new = b'<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.0/jquery.min.js"></script>\r\n\t<script type="text/javascript" src="${pageContext.request.contextPath}/js/util.js"></script>\r\n'
          if old not in data:
              raise SystemExit('Expected mixed line-ending sequence not found')
          path.write_bytes(data.replace(old, new, 1))
          Path('.github/workflows/fix-oldsete-line-ending.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "Terrion"
          git config user.email "63014185+terri0n@users.noreply.github.com"
          git add -A
          git commit -m "chore: preserve legacy SETE line endings [oldsete-line-ending-fixed]"
          git push origin HEAD:fix/browser-sokker-util
