name: Reapply short headings preserving bytes

on:
  push:
    branches:
      - fix/player-short-skill-headings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore main blob and patch ten lines
        shell: bash
        run: |
          set -euo pipefail
          path='sokker/WebContent/WEB-INF/tags/jugadores.tag'
          git show origin/main:"$path" > "$path"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sokker/WebContent/WEB-INF/tags/jugadores.tag')
          data = path.read_bytes()
          mappings = [
              (b'class="uppercase ordenar"', b'class="ordenar"', b'skills.stamina', b'skills.stamina_short'),
              (b'class="uppercase ordenar"', b'class="ordenar"', b'skills.pace', b'skills.pace_short'),
              (b'class="uppercase ordenar"', b'class="ordenar"', b'skills.technique', b'skills.technique_short'),
              (b'class="uppercase ordenar"', b'class="ordenar"', b'skills.passing', b'skills.passing_short'),
              (b'class="uppercase ordenar"', b'class="ordenar"', b'skills.keeper', b'skills.keeper_short'),
              (b'class="uppercase ordenar"', b'class="ordenar"', b'skills.defender', b'skills.defender_short'),
              (b'class="uppercase ordenar"', b'class="ordenar"', b'skills.playmaker', b'skills.playmaker_short'),
              (b'class="uppercase ordenar"', b'class="ordenar"', b'skills.striker', b'skills.striker_short'),
          ]

          lines = data.splitlines(keepends=True)
          changed = 0
          out = []
          for line in lines:
              original = line
              if b'ordenar_click' in line and b'<tags:string' in line:
                  for old_class, new_class, old_key, new_key in mappings:
                      token = b'key="' + old_key + b'"'
                      if token in line:
                          line = line.replace(token, b'key="' + new_key + b'"', 1)
                          line = line.replace(old_class, new_class, 1)
                  for old_key in [b'skills.tactical_discipline', b'skills.team_work']:
                      token = b'key="' + old_key + b'"'
                      if token in line:
                          line = line.replace(token, b'key="' + old_key + b'_short"', 1)
              if line != original:
                  changed += 1
              out.append(line)

          if changed != 10:
              raise SystemExit('Expected exactly 10 line changes, got %d' % changed)
          patched = b''.join(out)
          if patched.count(b'\r\n') == 0:
              raise SystemExit('CRLF was not preserved')
          path.write_bytes(patched)
          PY

          lines=$(git diff --numstat origin/main -- "$path" | awk '{print $1 ":" $2}')
          test "$lines" = '10:10'
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          path='sokker/WebContent/WEB-INF/tags/jugadores.tag'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'fix: preserve deployed short heading abbreviations'
          git push origin HEAD:fix/player-short-skill-headings
