name: Apply match finished fallback

on:
  push:
    branches:
      - fix/update-json-only

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-json-only

      - name: Reject missing finished state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java')
          text = path.read_text(encoding='utf-8')
          old = '\t\t\t\tBoolean finished = bool(match, "time.wasPlayed", "wasPlayed", "isFinished");\n\t\t\t\txml.append("<match><matchID>").append(id).append("</matchID>")'
          new = '\t\t\t\tBoolean finished = bool(match, "time.wasPlayed", "wasPlayed", "isFinished");\n\t\t\t\tif (finished == null) {\n\t\t\t\t\treturn null;\n\t\t\t\t}\n\t\t\t\txml.append("<match><matchID>").append(id).append("</matchID>")'
          count = text.count(old)
          if count != 1:
              raise SystemExit('Unexpected finished-state target count: %d' % count)
          path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terrion'
          git config user.email '63014185+terri0n@users.noreply.github.com'
          git add sokker/src/com/formulamanager/sokker/auxiliares/SokkerXmlCompat.java
          git diff --cached --check
          git commit -m 'Fallback when JSON match finished state is missing'
          git push origin HEAD:fix/update-json-only
