name: Restore bot icon

on:
  push:
    branches:
      - fix/bot-team-icon

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact deployed bot icon block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('sokker/WebContent/WEB-INF/tags/jugadores.tag')
          data = path.read_bytes()

          def blob_sha(raw):
              return hashlib.sha1(('blob %d\0' % len(raw)).encode('ascii') + raw).hexdigest()

          current_sha = blob_sha(data)
          before_sha = 'b25ca96bc6e68df7454abc3d9034155ab513df67'
          after_sha = 'c2121ac042bec693c2ddc387ec006265a698ad75'

          if current_sha == after_sha:
              print('Bot icon block already applied')
              raise SystemExit(0)
          if current_sha != before_sha:
              raise SystemExit('Unexpected jugadores.tag blob: ' + current_sha)

          anchor = (b'\t\t\t\t\t<c:if test="${j.nt > 0}">\r\n'
                    b'\t\t\t\t\t\t<span class=\'estrella\'>&#x2605;</span>\r\n'
                    b'\t\t\t\t\t</c:if>\r\n')
          addition = (b'\t\t\t\t\t<c:if test="${j.bot}">\r\n'
                      b'\t\t\t\t\t\t<span class="borde" title="Bot">&#x1F4BB;</span>\r\n'
                      b'\t\t\t\t\t</c:if>\r\n')
          if data.count(anchor) != 1:
              raise SystemExit('Expected NT-star anchor exactly once')

          patched = data.replace(anchor, anchor + addition, 1)
          patched_sha = blob_sha(patched)
          if patched_sha != after_sha:
              raise SystemExit('Unexpected patched blob: ' + patched_sha)

          path.write_bytes(patched)
          print('Patched jugadores.tag:', current_sha, '->', patched_sha)
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- sokker/WebContent/WEB-INF/tags/jugadores.tag; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sokker/WebContent/WEB-INF/tags/jugadores.tag
          git commit -m 'fix: restore bot team icon'
          git push origin HEAD:fix/bot-team-icon
