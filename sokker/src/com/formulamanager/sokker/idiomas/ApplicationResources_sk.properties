faq.answer1    = <p><i>Sokker Asistente</i> je online aplik\u00E1cia, ktor\u00E1 v\u00E1m pom\u00E1ha spravova\u0165 v\u00E1\u0161 t\u00EDm v <a target="_blank" href="https://www.sokker.org">Sokker</a> a dokonca aj n\u00E1rodn\u00FD t\u00EDm.</p>
faq.answer10   = <p>Projekcia v\u00E1m pom\u00E1ha vypo\u010D\u00EDta\u0165, ak\u00FD by mohol by\u0165 hr\u00E1\u010D v bud\u00FAcnosti, ak bude ka\u017Ed\u00FD t\u00FD\u017Ede\u0148 tr\u00E9nova\u0165 na 100 %.</p>\r\n\r\n<p>Vyberte vek, do ktor\u00E9ho chcete schopnosti hr\u00E1\u010Da projektova\u0165, a upravte talent pod\u013Ea potreby. Automaticky sa pripo\u010D\u00EDtaj\u00FA zv\u00FD\u0161enia schopnost\u00ED zo v\u0161eobecn\u00E9ho tr\u00E9ningu, ktor\u00E9 hr\u00E1\u010D nazbiera do zvolen\u00E9ho veku, a zobraz\u00ED sa po\u010Det individu\u00E1lnych tr\u00E9ningov, ktor\u00E9 m\u00F4\u017Eete pou\u017Ei\u0165. Potom zvy\u0161ujte schopnosti pod\u013Ea potreby a ukazovate\u013E zost\u00E1vaj\u00FAcich tr\u00E9ningov sa bude zni\u017Eova\u0165.</p>
faq.answer11   = <p>Tr\u00E9neri n\u00E1rodn\u00FDch t\u00EDmov jednotliv\u00FDch kraj\u00EDn zvy\u010Dajne pou\u017E\u00EDvaj\u00FA webov\u00E9 str\u00E1nky na evidenciu hr\u00E1\u010Dov. Ak ozna\u010D\u00EDte pr\u00EDslu\u0161n\u00FA vo\u013Ebu, <i>Sokker Asistente</i> automaticky odo\u0161le schopnosti va\u0161ich hr\u00E1\u010Dov na tieto str\u00E1nky:</p>
faq.answer13   = <p>Aby <i>Sokker Asistente</i> overil, \u017Ee heslo zadan\u00E9 z v\u00E1\u0161ho po\u010D\u00EDta\u010Da je spr\u00E1vne, mus\u00ED sa pripoji\u0165 priamo k <i>Sokker</i>. T\u00E1to oper\u00E1cia, naz\u00FDvan\u00E1 CORS, je v prehliada\u010Doch z bezpe\u010Dnostn\u00FDch d\u00F4vodov \u0161tandardne blokovan\u00E1.</p>\r\n\r\n<p>Existuje v\u0161ak nieko\u013Eko sp\u00F4sobov, ako toto obmedzenie vypn\u00FA\u0165. <b>POZN\u00C1MKA:</b> prin\u00E1\u0161a to riziko a s vypnutou ochranou sa neodpor\u00FA\u010Da nav\u0161tevova\u0165 ned\u00F4veryhodn\u00E9 str\u00E1nky.</p>\r\n\r\n<ol>\r\n<li><b>Nain\u0161talujte doplnok do prehliada\u010Da</b>. Re\u017Eim CORS m\u00F4\u017Eete zapn\u00FA\u0165 alebo vypn\u00FA\u0165 nieko\u013Ek\u00FDmi kliknutiami:<br/>\r\n<a href='https://mybrowseraddon.com/access-control-allow-origin.html'>Doplnok Allow CORS</a>\r\n</li>\r\n<div align = "center">\r\n<img class = "shadow" style = "margin-left: -22px;" src = 'img/faq/cors_plugin.png' /><br/>\r\n</div>\r\n\r\n<li><b>Vytvorte si z\u00E1stupcu prehliada\u010Da</b> s vypnut\u00FDm obmedzen\u00EDm a pou\u017E\u00EDvajte ho iba na str\u00E1nku <i>Sokker Asistente</i><br/>\r\n<b>Opera:</b> "C:\\Program Files (x86)\\Opera\\launcher.exe" --disable-web-security --user-data-dir = "c:\\nocorsbrowserdata" <br />\r\n<b>Chrome:</b> "C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe" --disable-web-security --user-data-dir = "c:\\nocorsbrowserdata"\r\n</li>\r\n<div align = "center">\r\n<img class = "shadow" style = "margin-left: -22px;" src = 'img/faq/cors_shortcut.png' />\r\n</div>\r\n\r\n<li><b>Pou\u017Eite aplik\u00E1ciu pre Android <a href="/sokker/app/SokkerAsistente.apk">app</a></b>.</li>\r\n\r\n<li><b>Pou\u017Eite Yandex Browser</b> (dostupn\u00FD pre <a href="https://play.google.com/store/apps/details?id=com.yandex.browser.alpha">Android</a> a <a href="https://apps.apple.com/es/app/yandex-browser/id483693909">iPhone</a>), ktor\u00FD umo\u017E\u0148uje nain\u0161talova\u0165 doplnok pre Chrome na povolenie CORS.</li>\r\n</ol>
faq.answer14   = <p>V ide\u00E1lnom pr\u00EDpade by sa minim\u00E1lny a maxim\u00E1lny talent mali pribli\u017Eova\u0165 k hodnote zodpovedaj\u00FAcej skuto\u010Dn\u00E9mu talentu hr\u00E1\u010Da, ale v\u00FDpo\u010Dty <i>Sokker Asistente</i> s\u00FA iba odhady zalo\u017Een\u00E9 na pribli\u017En\u00FDch vzorcoch. Preto je norm\u00E1lne, \u017Ee minim\u00E1lny talent hr\u00E1\u010Da m\u00F4\u017Ee niekedy prekro\u010Di\u0165 jeho maxim\u00E1lny talent. Skuto\u010Dn\u00FD talent hr\u00E1\u010Da sa s najv\u00E4\u010D\u0161ou pravdepodobnos\u0165ou nach\u00E1dza medzi t\u00FDmito dvoma hodnotami.</p>
faq.answer15   = <ol>\r\n<li>\u00DArove\u0148 schopnosti, ktor\u00FA chcete dosiahnu\u0165</li>\r\n<li>V\u0161eobecn\u00FD tr\u00E9ning</li>\r\n<li>Individu\u00E1lny tr\u00E9ning a po\u010Det nazbieran\u00FDch tr\u00E9ningov\u00FDch bodov</li>\r\n<li>S\u00FA\u010Det z\u00EDskan\u00FDch tr\u00E9ningov\u00FDch bodov</li>\r\n<li>Odhad tr\u00E9ningov\u00FDch bodov potrebn\u00FDch na dokon\u010Denie \u00FArovne pod\u013Ea vypo\u010D\u00EDtan\u00E9ho talentu hr\u00E1\u010Da, jeho veku a \u00FArovne schopnosti</li>\r\n<li>Dokon\u010Den\u00FD tr\u00E9ning, ktor\u00E9ho po\u010Diato\u010Dn\u00FD stav nie je zn\u00E1my</li>\r\n<li>Za\u010Dat\u00FD a dokon\u010Den\u00FD tr\u00E9ning</li>\r\n<li>Za\u010Dat\u00FD, ale nedokon\u010Den\u00FD tr\u00E9ning</li>\r\n</ol>
faq.answer16   = Pre hr\u00E1\u010Da vo veku "age" rokov, s odhadovan\u00FDm "average_talent", faktormi ulo\u017Een\u00FDmi v konfigur\u00E1cii "user" a dan\u00FDm "training" (tr\u00E9novan\u00E1 schopnos\u0165 a skill_value) sa potrebn\u00FD po\u010Det "training_points" vypo\u010D\u00EDta pod\u013Ea tohto vzorca:<br/>\r\n<pre class="prettyprint lang-java">\r\nfloat age_exponent = age - 16;\r\n\r\nfloat skill_exponent = training.skill_value - skill.getFactor(user);\r\n\r\nint training_points = skill == TRAINING_TYPE.Stamina ? 80 : (int)Math.round(getAverage_talent() * Math.pow(user.getAge_factor(skill), age_exponent) * Math.pow(user.getSkill_factor(), skill_exponent) * 47 * user.getTalent_factor());\r\n</pre>
faq.answer2    = <p>M\u00F4\u017Eete sledova\u0165 zmeny schopnost\u00ED svojich hr\u00E1\u010Dov, no najm\u00E4 m\u00F4\u017Eete ve\u013Emi presne sledova\u0165 tr\u00E9ning. Uvid\u00EDte, ko\u013Eko tr\u00E9ningov\u00FDch bodov m\u00E1 ka\u017Ed\u00FD hr\u00E1\u010D nazbieran\u00FDch v jednotliv\u00FDch schopnostiach, ko\u013Eko mu zost\u00E1va do \u010Fal\u0161ej \u00FArovne a ak\u00FD je jeho pribli\u017En\u00FD talent.</p>
faq.answer3    = <p>Ide o efekt\u00EDvny tr\u00E9ningov\u00FD \u010Das, ktor\u00FD hr\u00E1\u010D nazbieral za t\u00FD\u017Ede\u0148. Tento \u010Das presne nezodpoved\u00E1 odohran\u00FDm min\u00FAtam, preto\u017Ee ka\u017Ed\u00FD typ z\u00E1pasu m\u00E1 pre tr\u00E9ning in\u00FA v\u00E1hu, a je obmedzen\u00FD na 100 bodov za t\u00FD\u017Ede\u0148. <i>Sokker Asistente</i> pri po\u010D\u00EDtan\u00ED nazbieran\u00FDch tr\u00E9ningov\u00FDch bodov zoh\u013Ead\u0148uje aj v\u0161eobecn\u00FD tr\u00E9ning.</p>\r\n\r\n<p>Ekvivalent jednotliv\u00FDch typov z\u00E1pasov v tr\u00E9ningov\u00FDch bodoch je nasledovn\u00FD:</p>\r\n\r\n\u0009\u0009<div align="center">\r\n\u0009\u0009\u0009<div class="tabla">\r\n\u0009\u0009\u0009\u0009<table class="fondo_tabla">\r\n\u0009\u0009\u0009\u0009\u0009<thead class="borde">\r\n\u0009\u0009\u0009\u0009\u0009\u0009<tr>\r\n\u0009\u0009\u0009\u0009\u0009\u0009\u0009<th>Typ z\u00E1pasu</th>\r\n\u0009\u0009\u0009\u0009\u0009\u0009\u0009<th>Tr\u00E9ningov\u00E9 body</th>\r\n\u0009\u0009\u0009\u0009\u0009\u0009</tr>\r\n\u0009\u0009\u0009\u0009\u0009</thead>\r\n\u0009\u0009\u0009\u0009\u0009<tr>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td>Ofici\u00E1lny (liga, poh\u00E1r, bar\u00E1\u017E, Champions Cup)</td>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td align="center"><b>96</b></td>\r\n\u0009\u0009\u0009\u0009\u0009</tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td>Priate\u013Esk\u00FD</td>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td align="center"><b>85</b></td>\r\n\u0009\u0009\u0009\u0009\u0009</tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td>N\u00E1rodn\u00FD t\u00EDm (iba ofici\u00E1lny)</td>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td align="center"><b>85</b></td>\r\n\u0009\u0009\u0009\u0009\u0009</tr>\r\n\u0009\u0009\u0009\u0009</table>\r\n\u0009\u0009\u0009</div>\r\n\u0009\u0009</div>\r\n\r\n<p>Ak hr\u00E1\u010D dostane individu\u00E1lny tr\u00E9ning, na za\u010Diatku m\u00E1 50 tr\u00E9ningov\u00FDch bodov a nov\u00E9 z\u00EDskan\u00E9 body sa delia dvoma. Od 96 tr\u00E9ningov\u00FDch bodov sa \u010Fal\u0161ie body hromadia omnoho pomal\u0161ie a 100 % \u00FA\u010Dinnos\u0165 sa dosiahne pri 180 tr\u00E9ningov\u00FDch bodoch.</p>
faq.answer4    = <p>Pri priamom tr\u00E9ningu sa berie do \u00FAvahy iba schopnos\u0165 hlavn\u00E9ho tr\u00E9nera pre tr\u00E9novan\u00FA schopnos\u0165. Ak je na nadpozemskej \u00FArovni, tr\u00E9ning m\u00E1 100 % \u00FA\u010Dinnos\u0165; za ka\u017Ed\u00FD ch\u00FDbaj\u00FAci bod schopnosti sa \u00FA\u010Dinnos\u0165 zni\u017Euje o 6,25 %.</p>\r\n\r\n<p>Pri v\u0161eobecnom tr\u00E9ningu sa zoh\u013Ead\u0148uje priemer pr\u00EDslu\u0161nej schopnosti hlavn\u00E9ho tr\u00E9nera spolu so s\u00FA\u010Dtom \u00FArovn\u00ED asistentov vydelen\u00FDm tromi. Ak v\u00FDsledn\u00E1 \u00FArove\u0148 dosiahne nadpozemsk\u00FA \u00FArove\u0148, tr\u00E9ning m\u00E1 100 % \u00FA\u010Dinnos\u0165; za ka\u017Ed\u00FD ch\u00FDbaj\u00FAci bod sa \u00FA\u010Dinnos\u0165 zni\u017Euje o 6,25 %.</p>\r\n\r\n<p><i>Sokker Asistente</i> nepou\u017E\u00EDva iba vidite\u013En\u00FA \u00FArove\u0148 asistentov, ale sna\u017E\u00ED sa o \u010Do najpresnej\u0161\u00ED odhad. Ako doln\u00FA hranicu pou\u017E\u00EDva okrem \u00FArovne aj priemer ich schopnost\u00ED a ako horn\u00FA hranicu tieto dve hodnoty + 1 (za predpokladu, \u017Ee v\u0161etky \u010Diastkov\u00E9 \u00FArovne s\u00FA na maxime). Prienik t\u00FDchto hran\u00EDc tvor\u00ED mo\u017En\u00FD rozsah skuto\u010Dnej \u00FArovne; pou\u017Eije sa jeho stredn\u00E1 hodnota.</p>\r\n\r\n<p>Pr\u00EDklad:</p>\r\n\r\n\u0009\u0009<div style="text-align: center; margin: auto;">\r\n\u0009\u0009\u0009<div style="display: inline-block; text-align: left; background-color: white; opacity: 0.8; padding: 5px;">\r\n\u0009\u0009\u0009\u0009<b>Nae Varia&#x15F;</b>, vek: <b>67</b><br/>\r\n\u0009\u0009\u0009\u0009plat: <b>45 175 &euro;</b><br/>\r\n\u0009\u0009\u0009\u0009klub: <b>FormulaManager</b>, krajina: <b>Rom&#xE2;nia</b>,<br/>\r\n\u0009\u0009\u0009\u0009<b>magick\u00FD</b> tr\u00E9ner<br/>\r\n\u0009\u0009\u0009\u0009<br/>\r\n\u0009\u0009\u0009\u0009\u00DA\u010Dinnos\u0165 tr\u00E9ningu ako hlavn\u00FD tr\u00E9ner:<br/>\r\n\u0009\u0009\u0009\u0009<table>\r\n\u0009\u0009\u0009\u0009\u0009<tr style="background-color: transparent;"><td><b>nadpozemsk\u00E1</b> kond\u00EDcia</td><td><b>neuverite\u013En\u00FD</b> brank\u00E1r</td></tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr style="background-color: transparent;"><td><b>nadpozemsk\u00E1</b> r\u00FDchlos\u0165</td><td><b>nadpozemsk\u00E1</b> obrana</td></tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr style="background-color: transparent;"><td><b>magick\u00E1</b> technika</td><td><b>nadpozemsk\u00E1</b> tvorba hry</td></tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr style="background-color: transparent;"><td><b>nadpozemsk\u00E9</b> prihr\u00E1vanie</td><td><b>nadpozemsk\u00E1</b> stre\u013Eba</td></tr>\r\n\u0009\u0009\u0009\u0009</table>\r\n\u0009\u0009\u0009\u0009<br/>\r\n\u0009\u0009\u0009\u0009Hranice pod\u013Ea \u00FArovne tr\u00E9nera: <b>[15, 16[</b><br/>\r\n\u0009\u0009\u0009\u0009Hranice priemernej \u00FArovne schopnost\u00ED: <b>[15.5, 16.5[</b><br/>\r\n\u0009\u0009\u0009\u0009Prienik: <b>[15.5, 16[</b><br/>\r\n\u0009\u0009\u0009\u0009Nakoniec pou\u017Eijeme priemer: <b>15.75</b><br/>\r\n\u0009\u0009\u0009</div>\r\n\u0009\u0009</div>\r\n\r\n\u0009\u0009<p>Pri tomto sp\u00F4sobe v\u00FDpo\u010Dtu bude maxim\u00E1lna hodnota \u00FArovne asistenta <b>16.5</b>.</p>\r\n
faq.answer5    = <p><i>Sokker Asistente</i> nem\u00F4\u017Ee pozna\u0165 presn\u00E9 hodnoty pou\u017Eit\u00E9 po\u010Das tr\u00E9ningu; namiesto toho na\u010D\u00EDta \u00FAdaje ulo\u017Een\u00E9 v <i>Sokker</i> pri prvej aktualiz\u00E1cii po vykonan\u00ED tr\u00E9ningu. Ak v tomto obdob\u00ED urob\u00EDte zmeny, \u00FAdaje o tr\u00E9ningu m\u00F4\u017Eu by\u0165 nespr\u00E1vne.</p>\r\n<p>Existuje aj osobitn\u00FD pr\u00EDpad pri zraneniach: ke\u010F m\u00E1 hr\u00E1\u010D 7 dn\u00ED zranenia, <i>Sokker Asistente</i> nedok\u00E1\u017Ee zisti\u0165, \u010Di tr\u00E9ning dostal, preto\u017Ee to z\u00E1vis\u00ED od desatinnej \u010Dasti zranenia a toto rozhranie <i>Sokker</i> neposkytuje. Ak hr\u00E1\u010D tr\u00E9ning dostal, ale <i>Sokker Asistente</i> ho nezapo\u010D\u00EDtal, m\u00F4\u017Eete tr\u00E9ning upravi\u0165 a nastavi\u0165 po\u010Det dn\u00ED zranenia hr\u00E1\u010Da na "6". Tr\u00E9ning sa potom bude pova\u017Eova\u0165 za dokon\u010Den\u00FD.</p>
faq.answer6    = <p>Tento tr\u00E9ning funguje inak ne\u017E ostatn\u00E9 typy, preto\u017Ee nez\u00E1vis\u00ED od min\u00FAt odohran\u00FDch jednotliv\u00FDmi hr\u00E1\u010Dmi.</p>\r\n\r\n<p>Ka\u017Ed\u00FD t\u00FD\u017Ede\u0148 dostan\u00FA v\u0161etci hr\u00E1\u010Di pevn\u00E9 mno\u017Estvo tr\u00E9ningu kond\u00EDcie, pribli\u017Ene 10 % priameho tr\u00E9ningu. Z\u00E1rove\u0148 v\u0161ak m\u00F4\u017Ee ka\u017Ed\u00FD hr\u00E1\u010D n\u00E1hodne \u010Das\u0165 kond\u00EDcie strati\u0165. Strata je v\u00E4\u010D\u0161ia ne\u017E z\u00EDskan\u00FDch 10 %, preto sa niekedy stane, \u017Ee hr\u00E1\u010D t\u00FD\u017Ede\u0148 po zv\u00FD\u0161en\u00ED \u00FArovne kond\u00EDcie o \u00FArove\u0148 klesne. Za sez\u00F3nu predstavuje straten\u00E9 mno\u017Estvo pribli\u017Ene 50 % natr\u00E9novan\u00E9ho.</p>\r\n\r\n<p>Ke\u010F\u017Ee je prakticky nemo\u017En\u00E9 zisti\u0165, ak\u00E9 presn\u00E9 mno\u017Estvo kond\u00EDcie sa ka\u017Ed\u00FD t\u00FD\u017Ede\u0148 natr\u00E9novalo, <i>Sokker Asistente</i> pou\u017E\u00EDva odhad a ka\u017Ed\u00FD v\u0161eobecn\u00FD tr\u00E9ning kond\u00EDcie po\u010D\u00EDta ako 5 % priameho tr\u00E9ningu. Ko\u013Eko zost\u00E1va hr\u00E1\u010Dovi do zv\u00FD\u0161enia, mo\u017Eno odhadn\u00FA\u0165 s vedom\u00EDm, \u017Ee 100 % zodpoved\u00E1 \u00FApln\u00E9mu tr\u00E9ningu a hr\u00E1\u010D m\u00F4\u017Ee zv\u00FD\u0161i\u0165 cel\u00FA \u00FArove\u0148 pribli\u017Ene pri 80 % tr\u00E9ningu. Pri tr\u00E9ningu kond\u00EDcie preto m\u00F4\u017Eu niektor\u00ED hr\u00E1\u010Di zv\u00FD\u0161i\u0165 aj dve \u00FArovne naraz a vo v\u0161eobecnosti ka\u017Ed\u00FD hr\u00E1\u010D zv\u00FD\u0161i pribli\u017Ene jednu cel\u00FA \u00FArove\u0148 kond\u00EDcie za sez\u00F3nu (s dobr\u00FDm tr\u00E9nerom a asistentmi). V najlep\u0161om pr\u00EDpade, ak hr\u00E1\u010D nikdy ni\u010D nestrat\u00ED, m\u00F4\u017Ee zv\u00FD\u0161i\u0165 cel\u00FA \u00FArove\u0148 za 8 t\u00FD\u017Ed\u0148ov.</p>\r\n
faq.answer7    = <p>Talent je po\u010Det t\u00FD\u017Ed\u0148ov, ktor\u00E9 hr\u00E1\u010D potrebuje na zv\u00FD\u0161enie o jednu cel\u00FA \u00FArove\u0148 v juniorskej \u0161kole s dobr\u00FDm tr\u00E9nerom juniorov. Toto \u010D\u00EDslo nie je presn\u00E9, \u010Diasto\u010Dne pre v\u00FDrazn\u00FD prvok n\u00E1hody, ale \u010D\u00EDm viac t\u00FD\u017Ed\u0148ov sa pou\u017Eije vo v\u00FDpo\u010Dte, t\u00FDm men\u0161ia je chyba.</p>\r\n\r\n<p>Talent zo \u0161koly pribli\u017Ene zodpoved\u00E1 dvojn\u00E1sobku po\u010Dtu t\u00FD\u017Ed\u0148ov, ktor\u00E9 by 17-ro\u010Dn\u00FD hr\u00E1\u010D potreboval na zv\u00FD\u0161enie r\u00FDchlosti alebo stre\u013Eby na slab\u00FA \u00FArove\u0148, pr\u00EDpadne obrany, techniky, tvorby hry alebo prihr\u00E1vania na primeran\u00FA \u00FArove\u0148, ak m\u00E1 dobr\u00FDch tr\u00E9nerov a asistentov. Ka\u017Ed\u00E1 \u010Fal\u0161ia \u00FArove\u0148 zvy\u0161uje potrebn\u00FD \u010Das pribli\u017Ene o 9,4 % oproti predch\u00E1dzaj\u00FAcej \u00FArovni a podobne p\u00F4sob\u00ED ka\u017Ed\u00FD \u010Fal\u0161\u00ED rok veku. Ke\u010F teda pozn\u00E1me po\u010Det tr\u00E9ningov potrebn\u00FDch na zv\u00FD\u0161enie ur\u010Ditej \u00FArovne, m\u00F4\u017Eeme vypo\u010D\u00EDta\u0165 ostatn\u00E9.</p>\r\n\r\n<p>Hoci tu u\u017E nie je n\u00E1hodnos\u0165, zost\u00E1va chyba sp\u00F4soben\u00E1 t\u00FDm, \u017Ee vid\u00EDme iba celo\u010D\u00EDseln\u00FA hodnotu ka\u017Edej schopnosti. Op\u00E4\u0165 plat\u00ED, \u017Ee \u010D\u00EDm viac \u00FAdajov m\u00E1me, t\u00FDm presnej\u0161ie mo\u017Eno talent ohrani\u010Di\u0165.</p>\r\n
faq.answer8    = <p>Tento graf zobrazuje spracovan\u00FA hodnotu hr\u00E1\u010Da tak, aby sa odstr\u00E1nil vplyv zmien formy na jeho hodnotu. Tak mo\u017Eno analyzova\u0165, \u010Di hr\u00E1\u010D tr\u00E9noval.</p>\r\n\r\n<p>Hodnota sa po\u010D\u00EDta pomerne s oh\u013Eadom na to, \u017Ee hr\u00E1\u010D s tragickou formou m\u00E1 55 % hodnoty, ktor\u00FA by mal so superbo\u017Eskou formou.</p>\r\n
faq.answer9    = <p><i>Sokker Asistente</i> aplikuje <a href="https://en.wikipedia.org/wiki/Linear_regression" target="_blank">line\u00E1rnu regresiu</a> na jednotliv\u00E9 \u00FArovne priraden\u00E9 juniorovi po\u010Das jeho p\u00F4sobenia v \u0161kole, aby odhadol sklon priamky ur\u010Duj\u00FAcej jeho talent.</p>

