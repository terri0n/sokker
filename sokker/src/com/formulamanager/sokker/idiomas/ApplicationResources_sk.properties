faq.answer1    = <p><i>Sokker Asistent</i> je online aplik\u00E1cia, ktor\u00E1 v\u00E1m pom\u00F4\u017Ee spravova\u0165 v\u00E1\u0161 <a target="_blank" href="https://www.sokker.org">Sokker</a> t\u00EDm a dokonca aj n\u00E1rodn\u00FD t\u00EDm.</p>
faq.answer10   = <p>Projekcia v\u00E1m pom\u00F4\u017Ee vypo\u010D\u00EDta\u0165, ako by dan\u00FD hr\u00E1\u010D mohol vyzera\u0165 v bud\u00FAcnosti, ak by tr\u00E9noval ka\u017Ed\u00FD t\u00FD\u017Ede\u0148 na 100 %.</p>\r\n\r\n<p>Ak to chcete urobi\u0165, vyberte vek, od ktor\u00E9ho chcete, aby sa schopnosti hr\u00E1\u010Da prejavili a upravte talent pod\u013Ea svojich predst\u00E1v. Automaticky sa pripo\u010D\u00EDtaj\u00FA zv\u00FD\u0161enia schopnost\u00ED z\u00EDskan\u00E9 zo v\u0161eobecn\u00E9ho tr\u00E9ningu, ktor\u00E9 hr\u00E1\u010D nazbiera do dosiahnutia vybran\u00E9ho veku, a zobraz\u00ED sa zost\u00E1vaj\u00FAci po\u010Det Vami nastavite\u013En\u00FDch tr\u00E9ningov, ktor\u00E9 m\u00F4\u017Eete k tomu e\u0161te v sokkri pou\u017Ei\u0165. Ak si zv\u00FD\u0161te schopnosti pod\u013Ea svojich predst\u00E1v a ukazovate\u013E zost\u00E1vaj\u00FAcich tr\u00E9ningov sa zodpovedaj\u00FAcim sp\u00F4sobom zn\u00ED\u017Ei.</p>
faq.answer11   = <p>Tr\u00E9neri n\u00E1rodn\u00FDch t\u00EDmov r\u00F4znych kraj\u00EDn zvy\u010Dajne pou\u017E\u00EDvaj\u00FA t\u00FAto webov\u00FA str\u00E1nku na kontrolu hr\u00E1\u010Dov. Ak za\u0161krtnete pr\u00EDslu\u0161n\u00E9 pol\u00ED\u010Dko, <i>Sokker Asistent</i> automaticky odo\u0161le schopnosti va\u0161ich hr\u00E1\u010Dov na tieto webov\u00E9 str\u00E1nky:</p>
faq.answer13   = <p>Aby sa overila spr\u00E1vnos\u0165 tvojho hesla, <i>Sokker Asistent</i> sa mus\u00ED pripoji\u0165 k <i>Sokkeru</i>, s povolen\u00FDm CORS, ktor\u00FD nie je v prehliada\u010Doch z bezpe\u010Dnostn\u00FDch d\u00F4vodov be\u017Ene povolen\u00FD.</p>\r\n\r\n<p>Je nieko\u013Eko sp\u00F4sobov, ako povolenie zase zru\u0161i\u0165. <b>POZN\u00C1MKA:</b> Pou\u017Eitie CORS nesie riziko a nerad\u00EDme prehliada\u0165 nebezpe\u010Dn\u00E9 weby, ke\u010F je povolen\u00FD. Mo\u017Enosti pou\u017E\u00EDvania:</p>\r\n\r\n<ol>\r\n<li> <b>Nain\u0161talujte si doplnok do prehliada\u010Da a povo\u013Ete, \u010Di zak\u00E1\u017Ete si ho v\u017Edy pod\u013Ea potreby nieko\u013Ek\u00FDmi kliknutiami: <br/>\r\n<a href='https://mybrowseraddon.com/access-control-allow-origin.html'> Klikni sem na CORS plugin </a>\r\n</li>\r\n<div align = "center">\r\n<img class = "shadow" style = "margin-left: -22px;" src = 'img/faq/cors_plugin.png' /><br/>\r\n</div>\r\n\r\n<li> <b>Vytvorte odkaz na ploche pre prehliada\u010D s CORS a pou\u017E\u00EDvajte ho iba na navig\u00E1ciu v <i>Sokker Asistent</i> <br/>\r\n<b> Opera: </b> "C:\\Program Files (x86)\\Opera\\launcher.exe" --disable-web-security --user-data-dir = "c:\\nocorsbrowserdata" <br />\r\n<b> Chrome: </b> "C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe" --disable-web-security --user-data-dir = "c:\\nocorsbrowserdata"\r\n</li>\r\n<div align = "center">\r\n<img class = "shadow" style = "margin-left: -22px;" src = 'img/faq/cors_shortcut.png' />\r\n</div>\r\n\r\n<li> <b>Pou\u017Eite Android <a href="/sokker/app/SokkerAsistente.apk">app</a></b>.</li>\r\n\r\n<li> <b>Prehliada\u010D Yandex </b> (je k dispoz\u00EDcii pre <a href="https://play.google.com/store/apps/details?id=com.yandex.browser.alpha">Android</a> aj <a href="https://apps.apple.com/es/app/yandex-browser/id483693909">iPhone</a>). Umo\u017E\u0148uje do seba in\u0161talova\u0165 doplnok CORS z Chrome.</li>\r\n</ol>
faq.answer14   = <p>V ide\u00E1lnom pr\u00EDpade by sa najni\u017E\u0161\u00ED a najvy\u0161\u0161\u00ED talent mali zhodova\u0165 s \u010D\u00EDslom, ktor\u00E9 by zodpovedalo skuto\u010Dn\u00E9mu talentu hr\u00E1\u010Da, ale v\u00FDpo\u010Dty vykonan\u00E9 v <i>Sokker Asistent</i> s\u00FA odhady zalo\u017Een\u00E9 na hrub\u00FDch vzorcoch. Je teda norm\u00E1lne, \u017Ee v ur\u010Ditom bode minim\u00E1lny talent hr\u00E1\u010Da prevy\u0161uje jeho maxim\u00E1lny talent a pravdepodobne sa skuto\u010Dn\u00FD talent hr\u00E1\u010Da nach\u00E1dza medzi t\u00FDmito dvoma hodnotami.</p>
faq.answer15   = <ol>\r\n<li>\u00DArove\u0148 zru\u010Dnosti, ktor\u00FA chce\u0161 dosiahnu\u0165</li>\r\n<li>V\u0161eobecn\u00FD trening</li>\r\n<li>Nastaven\u00FD tr\u00E9ning a po\u010Det z\u00EDskan\u00FDch tr\u00E9ningov\u00FDch bodov</li>\r\n<li>S\u00FA\u010Det z\u00EDskan\u00FDch tr\u00E9ningov\u00FDch bodov</li>\r\n<li>Odhad tr\u00E9ningov\u00FDch bodov potrebn\u00FDch k dokon\u010Deniu \u00FArovne na z\u00E1klade vypo\u010D\u00EDtan\u00E9ho talentu, veku a \u00FArovne hr\u00E1\u010Dov\u00FDch zru\u010Dnost\u00ED</li>\r\n<li>Ukon\u010Den\u00FD Tr\u00E9ning, ktor\u00E9ho po\u010Diato\u010Dn\u00FD stav nie je zn\u00E1my</li>\r\n<li>Tr\u00E9ning sa za\u010Dal a ukon\u010Dil</li>\r\n<li>Tr\u00E9ning sa za\u010Dal, ale nebol ukon\u010Den\u00FD</li>\r\n</ol>
faq.answer16   = Vzh\u013Eadom na hr\u00E1\u010Da, ktor\u00FD m\u00E1 "age" (vek), odhadovan\u00FD priemern\u00FD talent "average_talent", niektor\u00E9 faktory ulo\u017Een\u00E9 v nastaveniach u\u017E\u00EDvate\u013Ea "user" a dan\u00FD tr\u00E9ning "training" (vytr\u00E9novan\u00E1 zru\u010Dnos\u0165 a hodnota zru\u010Dnosti) sa potrebn\u00FD po\u010Det tr\u00E9ningov\u00FDch bodov "training_points" vypo\u010D\u00EDta pomocou tohto vzorca:<br/>\r\n<pre class="prettyprint lang-java">\r\nfloat age_exponent = age - 16;\r\n\r\nfloat skill_exponent = training.skill_value - skill.getFactor(user);\r\n\r\nint training_points = skill == TRAINING_TYPE.Stamina ? 80 : (int)Math.round(getAverage_talent() * Math.pow(user.getAge_factor(skill), age_exponent) * Math.pow(user.getSkill_factor(), skill_exponent) * 47 * user.getTalent_factor());\r\n</pre>
faq.answer2    = <p>M\u00F4\u017Ee\u0161 sledova\u0165 zmeny v schopnostiach Tvojich hr\u00E1\u010Dov, ale ich tr\u00E9ning m\u00F4\u017Ee\u0161 sledova\u0165 doslova v milimetroch. Bude\u0161 vedie\u0165, ko\u013Eko tr\u00E9ningov\u00FDch bodov hr\u00E1\u010D nazbieral v ka\u017Edej zo schopnost\u00ED, ko\u013Eko mu zost\u00E1va do \u010Fal\u0161ej \u00FArovne a ak\u00FD je jeho pribli\u017En\u00FD talent.</p>
faq.answer3    = <p>Ide o efekt\u00EDvny tr\u00E9ningov\u00FD \u010Das, ktor\u00FD hr\u00E1\u010D nazbieral za t\u00FD\u017Ede\u0148. Tento \u010Das nezodpoved\u00E1 presne odohran\u00FDm z\u00E1pasov\u00FDm min\u00FAtam, lebo ka\u017Ed\u00FD typ z\u00E1pasu m\u00E1 in\u00FA v\u00E1hu pre tr\u00E9ning a je obmedzen\u00FD na 100 bodov za t\u00FD\u017Ede\u0148. <i>Sokker Asistent</i> tie\u017E zoh\u013Ead\u0148uje v\u0161eobecn\u00FD tr\u00E9ning pri po\u010D\u00EDtan\u00ED tr\u00E9ningov\u00FDch bodov.</p>\r\n\r\n<p>Po\u010Det tr\u00E9ningov\u00FDch bodov pre ka\u017Ed\u00FD typ z\u00E1pasu je nasledovn\u00FD:</p>\r\n\r\n\u0009\u0009<div align="center">\r\n\u0009\u0009\u0009<div class="tabla">\r\n\u0009\u0009\u0009\u0009<table class="fondo_tabla">\r\n\u0009\u0009\u0009\u0009\u0009<thead class="borde">\r\n\u0009\u0009\u0009\u0009\u0009\u0009<tr>\r\n\u0009\u0009\u0009\u0009\u0009\u0009\u0009<th>Typ z\u00E1pasu</th>\r\n\u0009\u0009\u0009\u0009\u0009\u0009\u0009<th>Tr\u00E9ningov\u00E9 body</th>\r\n\u0009\u0009\u0009\u0009\u0009\u0009</tr>\r\n\u0009\u0009\u0009\u0009\u0009</thead>\r\n\u0009\u0009\u0009\u0009\u0009<tr>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td>Ofici\u00E1lne (liga, poh\u00E1r, bar\u00E1\u017E, Poh\u00E1r majstrov)</td>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td align="center"><b>96</b></td>\r\n\u0009\u0009\u0009\u0009\u0009</tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td>Priate\u013Esk\u00FD</td>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td align="center"><b>85</b></td>\r\n\u0009\u0009\u0009\u0009\u0009</tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td>N\u00E1rodn\u00FD T\u00EDm (iba ofici\u00E1lny)</td>\r\n\u0009\u0009\u0009\u0009\u0009\u0009<td align="center"><b>85</b></td>\r\n\u0009\u0009\u0009\u0009\u0009</tr>\r\n\u0009\u0009\u0009\u0009</table>\r\n\u0009\u0009\u0009</div>\r\n\u0009\u0009</div>\r\n\r\n<p>Majte na pam\u00E4ti, \u017Ee pokia\u013E hr\u00E1\u010D m\u00E1 pokro\u010Dil\u00FD tr\u00E9ning, tak za\u010D\u00EDna automaticky s 50 tr\u00E9ningov\u00FDmi bodmi a novo z\u00EDskan\u00E9 tr\u00E9ningov\u00E9 body sa delia dvoma. Tie\u017E od 93 tr\u00E9ningov\u00FDch bodov sa nov\u00E9 tr\u00E9ningov\u00E9 body hr\u00E1\u010Dovi zbieraj\u00FA ove\u013Ea pomal\u0161ie a 100% efektivitu dosahuje hr\u00E1\u010D v tr\u00E9ningu a\u017E ke\u010F m\u00E1 celkovo 180 tr\u00E9ningov\u00FDch bodoch.</p>
faq.answer4    = <p>Pri priamom tr\u00E9ningu sa berie do \u00FAvahy iba zru\u010Dnos\u0165, ktor\u00FA tr\u00E9nujete od hlavn\u00E9ho tr\u00E9nera. Ak je t\u00E1to \u00FArove\u0148 tr\u00E9nera nadpozemsk\u00E1, tr\u00E9ning bude 100% efekt\u00EDvny, pri\u010Dom za ka\u017Ed\u00FA ch\u00FDbaj\u00FAcu v \u00FArove\u0148 sa strat\u00ED 6,25%. </p>\r\n\r\n<p>Pri v\u0161eobecnom tr\u00E9ningu sa berie do \u00FAvahy hodnota tej \u010Di onej konkr\u00E9tnej zru\u010Dnost\u00ED hlavn\u00E9ho tr\u00E9nera. To sa prir\u00E1ta k s\u00FA\u010Dtu \u00FArovn\u00ED asistentov vydelen\u00FDm 3. Ak je t\u00E1to v\u00FDsledn\u00E1 \u00FArove\u0148 nadpozemsk\u00E1 (16), tr\u00E9ning bude 100% efekt\u00EDvny. Ak je v\u00FDsledok tejto rovnice na ni\u017E\u0161ej \u00FArovni ako nadpozemsk\u00FD, tak plat\u00ED, \u017Ee - tr\u00E9ning hr\u00E1\u010Da strat\u00ED 6,25% efektivity a to za ka\u017Ed\u00FD ch\u00FDbaj\u00FAci bod ni\u017E\u0161ieho v\u00FDsledku tr\u00E9nerov z tejto rovnice. </p>\r\n\r\n<p><i>Sokker Assistente</i> sa neuspokoj\u00ED s pou\u017Eit\u00EDm vidite\u013Enej \u00FArovne asistentov, ale sk\u00F4r predstiera \u010Do najpresnej\u0161ie \u00FAdaje. Na tento \u00FA\u010Del okrem vidite\u013Enej \u00FArovne pou\u017E\u00EDvame priemer tr\u00E9nerov\u00FDch schopnost\u00ED ako minim\u00E1lny limit a tieto dve hodnoty + 1 ako maxim\u00E1lny limit (za predpokladu, \u017Ee v\u0161etky jeho pod\u00FArovne s\u00FA na maxime). Priese\u010Dn\u00EDk t\u00FDchto dvoch limitov vytvor\u00ED mo\u017En\u00FD rozsah skuto\u010Dnej hodnoty \u00FArovne, pri\u010Dom sa zachov\u00E1 stredn\u00E1 hodnota.</p>\r\n\r\n<p>Napr\u00EDklad:</p>\r\n\r\n\u0009\u0009<div style="text-align: center; margin: auto;">\r\n\u0009\u0009\u0009<div style="display: inline-block; text-align: left; background-color: white; opacity: 0.8; padding: 5px;">\r\n\u0009\u0009\u0009\u0009<b>Nae Varia\u015F</b>, vek: <b>67</b><br/>\r\n\u0009\u0009\u0009\u0009plat: <b>45 175 &euro;</b><br/>\r\n\u0009\u0009\u0009\u0009klub: <b>FormulaManager</b>, \u0161t\u00E1t: <b>Rom\u00E2nia</b>,<br/>\r\n\u0009\u0009\u0009\u0009<b>m\u00E1gical</b> tr\u00E9ner<br/>\r\n\u0009\u0009\u0009\u0009<br/>\r\n\u0009\u0009\u0009\u0009Efekt\u00EDvnos\u0165 tr\u00E9ningu ako hlavn\u00FD tr\u00E9ner:<br/>\r\n\u0009\u0009\u0009\u0009<table>\r\n\u0009\u0009\u0009\u0009\u0009<tr style="background-color: transparent;"><td><b>nadpozemsk\u00E1</b> kond\u00EDcia</td><td><b>neuverite\u013En\u00FD</b> v br\u00E1ne</td></tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr style="background-color: transparent;"><td><b>nadpozemsk\u00E1</b> r\u00FDchlos\u0165</td><td><b>nadpozemsk\u00E1</b> obrana</td></tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr style="background-color: transparent;"><td><b>magick\u00E1</b> technika</td><td><b>nadpozemsk\u00E1</b> tvorba</td></tr>\r\n\u0009\u0009\u0009\u0009\u0009<tr style="background-color: transparent;"><td><b>nadpozemsk\u00E9</b> prihr\u00E1vnie</td><td><b>nadpozemsk\u00FD</b> \u00FAtok</td></tr>\r\n\u0009\u0009\u0009\u0009</table>\r\n\u0009\u0009\u0009\u0009<br/>\r\n\u0009\u0009\u0009\u0009Limity pod\u013Ea \u00FArovne tr\u00E9nera: <b>[15, 16[</b><br/>\r\n\u0009\u0009\u0009\u0009Priemern\u00E9 limity \u00FArovne zru\u010Dnost\u00ED: <b>[15.5, 16.5[</b><br/>\r\n\u0009\u0009\u0009\u0009Priese\u010Dn\u00EDk <b>[15.5, 16[</b><br/>\r\n\u0009\u0009\u0009\u0009Nakoniec zost\u00E1vame pri priemere: <b>15,75</b><br/>\r\n\u0009\u0009\u0009</div>\r\n\u0009\u0009</div>\r\n\r\n\u0009\u0009<p>Pri tomto sp\u00F4sobe v\u00FDpo\u010Dtu bude maxim\u00E1lna \u00FArove\u0148 asistenta <b>16.5</b></p>\r\n
faq.answer5    = <p><i>Sokker Asistent</i> nevie presn\u00E9 hodnoty pou\u017Eit\u00E9 po\u010Das tr\u00E9ningu, ale namiesto toho pre\u010D\u00EDta \u00FAdaje ulo\u017Een\u00E9 v <i>Sokkeri</i> pri prvej aktualiz\u00E1cii po vykonan\u00ED tr\u00E9ningu. Tak\u017Ee ak tu v tomto obdob\u00ED vykon\u00E1te ak\u00E9ko\u013Evek zmeny, va\u0161e tr\u00E9ningov\u00E9 \u00FAdaje m\u00F4\u017Eu by\u0165 nespr\u00E1vne.</p>\r\n<p>Okrem toho existuje \u0161pecifick\u00FD pr\u00EDpad zranen\u00ED: ke\u010F m\u00E1 hr\u00E1\u010D 7 dn\u00ED zranenia, <i>Sokker Asistent</i> nem\u00F4\u017Ee vedie\u0165, \u010Di absolvoval tr\u00E9ning alebo nie, preto\u017Ee to z\u00E1vis\u00ED od desatinn\u00FDch miest zranenia a tieto inform\u00E1cie nie s\u00FA poskytovan\u00E9 <i>Sokkerom</i>. Ak tvoj hr\u00E1\u010D absolvoval tr\u00E9ning, ale <i>Sokker Asistent</i> ho nezapo\u010D\u00EDtal, m\u00F4\u017Ee\u0161 si tu upravi\u0165 tr\u00E9ning a nastavi\u0165 "6" dni zranenia hr\u00E1\u010Da. T\u00FDmto sp\u00F4sobom bude tr\u00E9ning pova\u017Eovan\u00FD za vykonan\u00FD.</p>
faq.answer6    = <p>Funguje to inak ako in\u00E9 typy tr\u00E9ningov, preto\u017Ee je to nez\u00E1visl\u00E9 od min\u00FAt, ktor\u00E9 ka\u017Ed\u00FD hr\u00E1\u010D odohral. </p>\r\n\r\n<p>Ka\u017Ed\u00FD t\u00FD\u017Ede\u0148 v\u0161etci hr\u00E1\u010Di dostan\u00FA pevn\u00E9 mno\u017Estvo tr\u00E9ningu kond\u00EDcie, ktor\u00E9, ako som u\u017E povedal, predstavuje pribli\u017Ene 10 % priameho tr\u00E9ningu. Z\u00E1rove\u0148 v\u0161ak hr\u00E1\u010D m\u00F4\u017Ee ka\u017Ed\u00FD t\u00FD\u017Ede\u0148 n\u00E1hodne strati\u0165 ur\u010Dit\u00E9 mno\u017Estvo kond\u00EDcie. Ke\u010F sa strat\u00ED, toto mno\u017Estvo je v\u00E4\u010D\u0161ie ako prijat\u00FDch 10 %, tak\u017Ee s\u00FA chv\u00EDle, ke\u010F hr\u00E1\u010Di stratia \u00FArove\u0148 kond\u00EDcie t\u00FD\u017Ede\u0148 po jej zv\u00FD\u0161en\u00ED. Po\u010Das sez\u00F3ny je straten\u00E9 mno\u017Estvo pribli\u017Ene 50 % z toho, \u010Do sa natr\u00E9nuje.</p>\r\n\r\n<p>Ke\u010F\u017Ee by bolo takmer nemo\u017En\u00E9 vedie\u0165, ak\u00E9 mno\u017Estvo kond\u00EDcie sa v skuto\u010Dnosti tr\u00E9nuje ka\u017Ed\u00FD t\u00FD\u017Ede\u0148, <i>Sokker Asistent</i> rob\u00ED pribli\u017En\u00FD odhad, pri\u010Dom ka\u017Ed\u00FD v\u0161eobecn\u00FD tr\u00E9ning kond\u00EDcie po\u010D\u00EDta ako 5 % priameho tr\u00E9ningu. M\u00F4\u017Eete si urobi\u0165 predstavu o \u200B\u200Bko\u013Eko v\u00E1m zost\u00E1va na zv\u00FD\u0161enie \u00FArovne u ka\u017Ed\u00E9ho hr\u00E1\u010Da, s vedom\u00EDm toho, \u017Ee 100 % sa rovn\u00E1 kompletn\u00E9mu tr\u00E9ningu a \u017Ee hr\u00E1\u010D sa m\u00F4\u017Ee posun\u00FA\u0165 o cel\u00FA \u00FArove\u0148 vy\u0161\u0161ie s pribli\u017Ene 80 % tr\u00E9novania. Ak tr\u00E9nujete kond\u00EDciu, m\u00F4\u017Eu existova\u0165 hr\u00E1\u010Di, ktor\u00ED si ju zv\u00FD\u0161ia 1 tr\u00E9ningom a\u017E 2 \u00FArovne. Hr\u00E1\u010D dosiahne maxim\u00E1lnu \u00FArove\u0148 kond\u00EDcie za sez\u00F3nu tr\u00E9ningu (s dobr\u00FDm tr\u00E9nerom a asistentmi). V najlep\u0161om pr\u00EDpade, ak m\u00E1te to \u0161\u0165astie, \u017Ee nikdy nestrat\u00EDte tr\u00E9ning, tak m\u00F4\u017Ee sa hr\u00E1\u010D posun\u00FA\u0165 na maxim\u00E1lnu \u00FArove\u0148 kond\u00EDcie u\u017E za 8 t\u00FD\u017Ed\u0148ov.</p>\r\n
faq.answer7    = <p>Talent je po\u010Det t\u00FD\u017Ed\u0148ov, ktor\u00E9 hr\u00E1\u010D potrebuje na to, aby sa v juniorskej \u0161kole s dobr\u00FDm tr\u00E9nerom posunul na \u010Fal\u0161iu \u00FArove\u0148. Toto \u010D\u00EDslo nie je presn\u00E9 \u010Diasto\u010Dne preto, \u017Ee existuje d\u00F4le\u017Eit\u00E1 n\u00E1hodnos\u0165, ale \u010D\u00EDm viac t\u00FD\u017Ed\u0148ov sa v\u00FDpo\u010Det talentu pou\u017Eije, t\u00FDm v\u00FDpo\u010Det talentu presnej\u0161\u00ED.</p>\r\n\r\n<p>Na druhej strane, talent v juniorke zodpoved\u00E1 zhruba dvojn\u00E1sobku t\u00FD\u017Ed\u0148ov, ktor\u00E9 by 17-ro\u010Dn\u00FD hr\u00E1\u010D potreboval na zv\u00FD\u0161enie svojej r\u00FDchlosti z \u00FArovne 3 na \u00FArove\u0148 4, alebo na zlep\u0161enie obrany, \u00FAtoku, techniky, tvorby a prihr\u00E1vok z \u00FArovne 4 na \u00FArove\u0148 5, za predpokladu, \u017Ee m\u00E1te dobr\u00FDch tr\u00E9nerov a asistentov. Ka\u017Ed\u00E1 \u010Fal\u0161ia vy\u0161\u0161ia \u00FArove\u0148 zru\u010Dnosti predpoklad\u00E1 pribli\u017Ene 9,4 % n\u00E1rast spomalenia tr\u00E9ningu oproti predch\u00E1dzaj\u00FAcej \u00FArovni a ka\u017Ed\u00FD rok vy\u0161\u0161ej \u00FArovne tie\u017E. Ke\u010F vieme, ko\u013Eko tr\u00E9ningov potrebujeme na zv\u00FD\u0161enie ur\u010Ditej \u00FArovne, vieme vypo\u010D\u00EDta\u0165 v\u0161etko ostatn\u00E9.</p>\r\n\r\n<p>Hoci tu nejde o n\u00E1hodnos\u0165, existuje miera chyby v na\u0161om v\u00FDpo\u010Dte, preto\u017Ee vid\u00EDme iba celo\u010D\u00EDseln\u00FA hodnotu ka\u017Edej zru\u010Dnosti. Op\u00E4\u0165 plat\u00ED, \u017Ee \u010D\u00EDm viac \u00FAdajov m\u00E1me, t\u00FDm lep\u0161ie talent m\u00F4\u017Eeme vypo\u010D\u00EDta\u0165.</p>\r\n
faq.answer8    = <p>Tento graf zobrazuje upraven\u00FA hodnotu hr\u00E1\u010Da s cie\u013Eom eliminova\u0165 vplyv zmien formy na celkov\u00FA hodnotu hr\u00E1\u010Da. T\u00FDmto sp\u00F4sobom m\u00F4\u017Eete analyzova\u0165, \u010Di hr\u00E1\u010D tr\u00E9noval alebo nie..</p>\r\n\r\n<p>Na tento \u00FA\u010Del hodnotu hr\u00E1\u010Da ur\u010D\u00EDme proporcion\u00E1lne, vzh\u013Eadom k tomu, \u017Ee hr\u00E1\u010D s tragickou formou bude ma\u0165 55 % hodnoty z tej ak\u00FA by mal s nadprirodzenou formou.</p>\r\n
faq.answer9    = <p><i>Sokker Asistent</i> aplikuje a <a href="https://en.wikipedia.org/wiki/Linear_regression" target="_blank">line\u00E1rnu regressiu</a> na r\u00F4znych \u00FArovniach pridelen\u00FDch va\u0161im juniorom po\u010Das ich \u017Eivota, aby nasmeroval sklon \u010Diary v grafe, ktor\u00E1 by ur\u010Dila ich talent..\r\n
